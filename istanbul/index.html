<!DOCTYPE html>

          padding: 8px 12px; border-radius: 12px; font-size: 13px; user-select: none;
          border: 1px solid #c97b5e; z-index: 10; }
  #debug { display: none; position: absolute; top: 12px; right: 12px; min-width: 290px; margin: 0;
           padding: 12px 14px; color: #f8ead8; background: rgba(40, 31, 27, 0.9);
           border: 1px solid rgba(244, 196, 154, 0.75); border-radius: 10px; z-index: 10;
           font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
           pointer-events: auto; user-select: text; }
  #debug-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
                    color: #f8ead8; font: 12px/1.4 sans-serif; }
  #debug-controls select { color: #49372c; background: #fff3df; border: 1px solid #d39a78;
                           border-radius: 5px; padding: 4px 7px; font: inherit; cursor: pointer; }
  #debug-controls select:focus-visible { outline: 2px solid #f3c1b5; outline-offset: 2px; }
  #debug-readout { margin: 0; color: inherit; font: inherit; white-space: pre; }
  #landmark-dialog { width: min(430px, calc(100vw - 32px)); padding: 0; color: #49372c;
                     background: #fff8ea; border: 1px solid #c97b5e; border-radius: 18px;

  #landmark-dialog::backdrop { background: rgba(49, 38, 32, 0.46); backdrop-filter: blur(3px); }
  .landmark-dialog__content { position: relative; padding: 28px 30px 30px; }
  .landmark-dialog__eyebrow { margin: 0 0 6px; color: #a45843; font-size: 12px;
                              font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  #landmark-title { margin: 0 36px 12px 0; color: #5b4636; font-family: Georgia, serif;
                    font-size: clamp(25px, 5vw, 34px); line-height: 1.08; }
  #landmark-description { margin: 0; font-size: 15px; line-height: 1.65; }
  .landmark-dialog__close { position: absolute; top: 16px; right: 16px; display: grid;
                            width: 34px; height: 34px; padding: 0; place-items: center;
                            color: #5b4636; background: #f3dfc7; border: 0; border-radius: 50%;
                            font-size: 22px; line-height: 1; cursor: pointer; }
  .landmark-dialog__close:hover { background: #e9c9aa; }
  .landmark-dialog__close:focus-visible { outline: 3px solid #4f8f8b; outline-offset: 2px; }
  @media (max-width: 520px) {

<body>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- scene basics ----------
const scene = new THREE.Scene();
scene.scale.setScalar(5.0);
const TIME_OF_DAY_PRESETS = Object.freeze({
  earlyMorning: {
    label: 'Early morning',
    top: '#7188bb', middle: '#c697b1', lower: '#e8ad9f', horizon: '#f4c8a6',
    sunX: 0.20, sunY: 0.57, glowInner: 'rgba(255, 226, 190, 0.82)',
    glowOuter: 'rgba(247, 175, 171, 0)', fog: 0xe6b9ae,
    hemiSky: 0xb7c7e7, sunColor: 0xffc39f, sunIntensity: 0.95,
    sunPosition: [-80, 48, 110], fillColor: 0xf0c2bb, fillIntensity: 0.28,
    ambientIntensity: 0.38, cloudColor: 0xffe8e3, cloudOpacity: 0.44, stars: false,
  },
  goldenHour: {
    label: 'Golden hour',
    top: '#9b91c7', middle: '#d79db6', lower: '#efb2a8', horizon: '#f6d1ad',
    sunX: 0.73, sunY: 0.56, glowInner: 'rgba(255, 239, 196, 0.9)',
    glowOuter: 'rgba(255, 183, 170, 0)', fog: 0xf3c1b5,
    hemiSky: 0xffd4c2, sunColor: 0xffb778, sunIntensity: 1.6,
    sunPosition: [80, 38, 60], fillColor: 0xf4c89a, fillIntensity: 0.22,
    ambientIntensity: 0.35, cloudColor: 0xffeee7, cloudOpacity: 0.52, stars: false,
  },
  midnight: {
    label: 'Midnight',
    top: '#10182f', middle: '#222c51', lower: '#3d466d', horizon: '#686985',
    sunX: 0.76, sunY: 0.58, glowInner: 'rgba(154, 174, 235, 0.2)',
    glowOuter: 'rgba(73, 93, 170, 0)', fog: 0x4d506c,
    hemiSky: 0x35436d, sunColor: 0x8392c9, sunIntensity: 0.12,
    sunPosition: [-100, 120, -80], fillColor: 0x6472a3, fillIntensity: 0.16,
    ambientIntensity: 0.2, cloudColor: 0x737b9d, cloudOpacity: 0.28, stars: true,
  },
});

function createSkyTexture(preset = TIME_OF_DAY_PRESETS.goldenHour) {
  const canvas = document.createElement('canvas');
  canvas.width = 1600;
  canvas.height = 900;
  const ctx = canvas.getContext('2d');

  // A vertical gradient gives the sky depth instead of a single flat color.
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, preset.top);
  gradient.addColorStop(0.34, preset.middle);
  gradient.addColorStop(0.7, preset.lower);
  gradient.addColorStop(1, preset.horizon);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Diffuse low sun glow, softened so it blends into the warm sky.
  const sunGlow = ctx.createRadialGradient(
    canvas.width * preset.sunX, canvas.height * preset.sunY, 8,
    canvas.width * preset.sunX, canvas.height * preset.sunY, canvas.height * 0.34
  );
  sunGlow.addColorStop(0, preset.glowInner);
  sunGlow.addColorStop(0.18, preset.glowInner);
  sunGlow.addColorStop(1, preset.glowOuter);
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (preset.stars) {
    // Deterministic pinpricks keep midnight calm rather than noisy.
    let seed = 17;
    for (let i = 0; i < 90; i++) {
      seed = (seed * 16807) % 2147483647;
      const x = (seed / 2147483647) * canvas.width;
      seed = (seed * 16807) % 2147483647;
      const y = (seed / 2147483647) * canvas.height * 0.62;
      const radius = 0.35 + (seed / 2147483647) * 0.9;
      ctx.fillStyle = `rgba(236, 231, 255, ${0.35 + radius * 0.35})`;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
scene.background = createSkyTexture();
// Warm distance fog so the horizon dissolves into the golden-hour sky —
// keeps distant shapes readable without hard edges, and reinforces the
// soft ambient occlusion feel across the chunky pastel cityscape.
scene.fog = new THREE.Fog(0xf3c1b5, 1800, 4200);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 6000);
// Pulled back and up so the camera sits just outside the (5×-scaled) land
// disc and looks diagonally at the scene, rather than hovering low over
// the Bosphorus and looking straight down the water.
// camera.position.set(1988, 1068, 370);
camera.position.set(1159, 634, 1870);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
// Pivot on the European side (where the mosques, Galata and the aqueduct
// cluster) instead of the strait centerline, so the initial framing
// foregrounds the city rather than the Bosphorus.
controls.target.set(-60, 10, -40);
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 5;
controls.maxDistance = 5000;
controls.enableDamping = true;
// Each scroll tick / pinch step moves the camera further along the dolly axis.
controls.zoomSpeed = 4.0;

// ---------- debug overlay ----------
// Backquote is commonly used for developer consoles and does not conflict
// with any of the scene's pointer/touch controls.
const debugPanel = document.getElementById('debug');
const debugReadout = document.getElementById('debug-readout');
const timeOfDaySelect = document.getElementById('debug-time');
let currentTimeOfDay = 'goldenHour';
let debugVisible = false;
let debugFrames = 0;
let debugFps = 0;
let debugLastSample = performance.now();

function formatVector(v) {
  return `${v.x.toFixed(2)}, ${v.y.toFixed(2)}, ${v.z.toFixed(2)}`;
}

function updateDebugPanel(now) {
  debugFrames++;
  const elapsed = now - debugLastSample;
  if (elapsed >= 500) {
    debugFps = debugFrames * 1000 / elapsed;
    debugFrames = 0;
    debugLastSample = now;
  }
  if (!debugVisible) return;

  const renderInfo = renderer.info.render;
  const memoryInfo = renderer.info.memory;
  const azimuth = THREE.MathUtils.radToDeg(controls.getAzimuthalAngle());
  const polar = THREE.MathUtils.radToDeg(controls.getPolarAngle());
  const cameraDistance = camera.position.distanceTo(controls.target);

  debugReadout.textContent = [
    'ISTANBUL DEBUG  [` to close]',
    '',
    `Time of day      ${TIME_OF_DAY_PRESETS[currentTimeOfDay].label}`,
    `FPS              ${debugFps.toFixed(1)}`,
    `Camera position  ${formatVector(camera.position)}`,
    `Camera target    ${formatVector(controls.target)}`,
    `Camera distance  ${cameraDistance.toFixed(2)}`,
    `Orbit azimuth    ${azimuth.toFixed(2)}°`,
    `Orbit polar      ${polar.toFixed(2)}°`,
    `Viewport         ${innerWidth} × ${innerHeight}`,
    `Pixel ratio      ${renderer.getPixelRatio().toFixed(2)}`,
    '',
    `Scene children   ${scene.children.length}`,
    `Draw calls       ${renderInfo.calls}`,
    `Triangles        ${renderInfo.triangles.toLocaleString()}`,
    `Geometries       ${memoryInfo.geometries}`,
    `Textures         ${memoryInfo.textures}`,
    '',
    `Tram progress    ${(tramT * 100).toFixed(1)}%`,
    `Tram position    ${formatVector(tramGroup.position)}`,
    `Ferries active   ${boats.length}`,
  ].join('\n');
}

document.addEventListener('keydown', (event) => {
  if (event.code !== 'Backquote' || event.repeat) return;
  event.preventDefault();
  debugVisible = !debugVisible;
  debugPanel.style.display = debugVisible ? 'block' : 'none';
  debugPanel.setAttribute('aria-hidden', String(!debugVisible));
  if (debugVisible) updateDebugPanel(performance.now());
});

// ---------- custom touch handling ----------
// OrbitControls already drives single-finger drag for rotation. For
// two-finger gestures we override the default so that:
//   - horizontal swipe → orbit (rotate)
//   - vertical swipe   → dolly (zoom in / zoom out)
//   - pinch (spread)   → zoom (same direction as the vertical dolly)
// We register on document with capture:true so these listeners fire
// BEFORE OrbitControls' target listeners on the canvas; calling
// stopPropagation then keeps OrbitControls from also handling the same
// gesture.
const dom = renderer.domElement;
const twoFinger = { active: false, mode: null, cx: 0, cy: 0, startDist: 0 };

// OrbitControls in three@0.160 does NOT expose rotateLeft / dollyIn /
// dollyOut / getDollyScale on `this` — they're closure-internal. We
// apply rotations and dolly directly to the camera position; the next
// controls.update() tick re-syncs from there. The math matches what
// OrbitControls does internally (rotate around camera.up, which is the
// default world (0,1,0) in this scene).
const _camOffset = new THREE.Vector3();
const _worldUp = new THREE.Vector3(0, 1, 0);

function rotateHorizontal(dx) {
  // Same magnitude formula OrbitControls uses for mouse-drag rotate.
  // The sign is flipped so applyAxisAngle produces the same direction
  // as OrbitControls' rotateLeft(positive) — clockwise around +Y.
  const angle = 2 * Math.PI * dx / dom.clientHeight;
  _camOffset.copy(camera.position).sub(controls.target);
  _camOffset.applyAxisAngle(_worldUp, -angle);
  camera.position.copy(controls.target).add(_camOffset);
}

function dollyBy(dy) {
  // dy > 0 (drag down) → zoom out
  // dy < 0 (drag up)   → zoom in
  const dollyDelta = (Math.abs(dy) / dom.clientHeight) * 20;
  const dollyScale = Math.pow(0.95, dollyDelta);
  _camOffset.copy(camera.position).sub(controls.target);
  if (dy > 0) _camOffset.multiplyScalar(1 / dollyScale);
  else        _camOffset.multiplyScalar(dollyScale);
  // Respect OrbitControls' min/max distance clamps
  const clamped = Math.max(controls.minDistance,
                  Math.min(controls.maxDistance, _camOffset.length()));
  _camOffset.setLength(clamped);
  camera.position.copy(controls.target).add(_camOffset);
}

function pinchBy(curDist, startDist) {
  const scale = curDist / startDist;
  _camOffset.copy(camera.position).sub(controls.target);
  _camOffset.multiplyScalar(1 / scale);
  const clamped = Math.max(controls.minDistance,
                  Math.min(controls.maxDistance, _camOffset.length()));
  _camOffset.setLength(clamped);
  camera.position.copy(controls.target).add(_camOffset);
}

function tsStart(e) {
  if (e.target !== dom || e.touches.length !== 2) return;
  e.preventDefault();
  e.stopPropagation();
  const t0 = e.touches[0], t1 = e.touches[1];
  twoFinger.active = true;
  twoFinger.mode = null;
  twoFinger.startDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  twoFinger.cx = (t0.clientX + t1.clientX) / 2;
  twoFinger.cy = (t0.clientY + t1.clientY) / 2;
}

function tsMove(e) {
  if (!twoFinger.active || e.touches.length !== 2) return;
  e.preventDefault();
  e.stopPropagation();
  const t0 = e.touches[0], t1 = e.touches[1];
  const cx = (t0.clientX + t1.clientX) / 2;
  const cy = (t0.clientY + t1.clientY) / 2;
  const curDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  const dx = cx - twoFinger.cx;
  const dy = cy - twoFinger.cy;

  // Lock the gesture to its dominant flavour on the first move
  if (twoFinger.mode === null) {
    const distChange = Math.abs(curDist - twoFinger.startDist);
    if (distChange > 10)            twoFinger.mode = 'pinch';
    else if (Math.abs(dx) > Math.abs(dy)) twoFinger.mode = 'rotate';
    else                             twoFinger.mode = 'dolly';
  }

  if (twoFinger.mode === 'rotate') {
    rotateHorizontal(dx);
  } else if (twoFinger.mode === 'dolly') {
    dollyBy(dy);
  } else { // pinch
    pinchBy(curDist, twoFinger.startDist);
    twoFinger.startDist = curDist; // incremental so each move scales from the last
  }

  twoFinger.cx = cx;
  twoFinger.cy = cy;
}

function tsEnd(e) {
  if (twoFinger.active && e.touches.length < 2) {
    twoFinger.active = false;
    twoFinger.mode = null;
  }
}

document.addEventListener('touchstart',  tsStart, { passive: false, capture: true });
document.addEventListener('touchmove',   tsMove,  { passive: false, capture: true });
document.addEventListener('touchend',    tsEnd,   { capture: true });
document.addEventListener('touchcancel', tsEnd,   { capture: true });

// ---------- horizontal trackpad / wheel handling ----------
// On a trackpad (or Magic Mouse), a two-finger horizontal swipe arrives
// as a `wheel` event with a non-zero deltaX — not as touch events.
// Firefox and some Linux setups instead send horizontal motion as
// vertical wheel + Shift. We catch both, while leaving vertical wheel
// and pinch (ctrl+wheel) zoom for OrbitControls to handle.
//
// Registered on `document` with `capture:true` so we run BEFORE
// OrbitControls' own canvas wheel listener; `stopPropagation` then
// stops the gesture from being doubled as a zoom.
document.addEventListener('wheel', (e) => {
  // Pinch on macOS trackpad: ctrlKey + deltaY. Pass through to OrbitControls.
  if (e.ctrlKey) return;

  // Horizontal-dominant wheel (macOS / Windows / Magic Mouse trackpads)
  if (e.deltaX !== 0 && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    e.preventDefault();
    e.stopPropagation();
    rotateHorizontal(e.deltaX);
    return;
  }

  // Shift+vertical wheel (Firefox / some Linux setups treat this as horizontal)
  if (e.shiftKey && e.deltaX === 0 && e.deltaY !== 0) {
    e.preventDefault();
    e.stopPropagation();
    rotateHorizontal(e.deltaY);
    return;
  }

  // Anything else (plain vertical wheel / pinch handled above) — let
  // OrbitControls deal with it as a zoom.
}, { passive: false, capture: true });

// ---------- golden hour lighting ----------
// Hemisphere light gives a soft sky/ground gradient — a cheap stand-in for
// baked ambient occlusion that fills the chunky matte surfaces with warmth
// from above and a hint of sage bounce from the ground.
const hemi = new THREE.HemisphereLight(0xffd4c2, 0xa8c69b, 0.65);
scene.add(hemi);
// Warm ambient fill so even shadow-side surfaces stay readable.
const ambient = new THREE.AmbientLight(0xffeacd, 0.35);
scene.add(ambient);
// Low-angle amber sun — directional source doing the heavy lifting for
// golden-hour shadows. Positioned near the horizon so shadows stretch long.
const sun = new THREE.DirectionalLight(0xffb778, 1.6);
sun.position.set(80, 38, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -280; sun.shadow.camera.right = 280;
sun.shadow.camera.top = 280; sun.shadow.camera.bottom = -280;
sun.shadow.bias = -0.0005;
scene.add(sun);
// Soft peach fill from the opposite side, just enough to keep shadowed
// faces from going flat without erasing the directional contrast.
const fill = new THREE.DirectionalLight(0xf4c89a, 0.22);
fill.position.set(-50, 30, -40);
scene.add(fill);

// Soft, hovering cloud banks. Each bank is built from overlapping flattened
// puffs so the low-poly style stays consistent while the silhouettes remain
// irregular and more natural than a single plane or billboard.
const cloudMaterials = [];
const clouds = [];
function addCloud(position, scale, opacity = 0.52) {
  const cloud = new THREE.Group();
  const material = new THREE.MeshStandardMaterial({
    color: 0xffeee7,
    roughness: 1,
    metalness: 0,
    transparent: true,
    opacity,
    depthWrite: false,
  });
  cloudMaterials.push(material);
  const puffs = [
    [-12, 0,  2, 1.15],
    [ -5, 3,  0, 1.35],
    [  4, 5,  1, 1.55],
    [ 13, 1, -1, 1.1],
    [ 21, 0,  2, 0.78],
  ];
  for (const [x, y, z, size] of puffs) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(10, 12, 8), material);
    puff.position.set(x, y, z);
    puff.scale.set(size, 0.42 + size * 0.16, 0.72 + size * 0.12);
    cloud.add(puff);
  }
  cloud.position.set(position.x, position.y, position.z);
  cloud.scale.setScalar(scale);
  cloud.rotation.y = position.x * 0.003;
  const cloudIndex = clouds.length;
  cloud.userData.basePosition = position.clone();
  cloud.userData.driftPhase = cloudIndex * 1.73;
  cloud.userData.driftSpeed = 1 + cloudIndex * 0.006;
  clouds.push(cloud);
  scene.add(cloud);
}

addCloud(new THREE.Vector3(-175, 148, -150), 1.15, 0.46);
addCloud(new THREE.Vector3(  55, 182,  -80), 1.35, 0.42);
addCloud(new THREE.Vector3( 165, 132,   55), 0.92, 0.38);
addCloud(new THREE.Vector3( -15, 226,  175), 1.1, 0.34);

let skyTexture = scene.background;
function applyTimeOfDay(timeOfDay) {
  const preset = TIME_OF_DAY_PRESETS[timeOfDay] || TIME_OF_DAY_PRESETS.goldenHour;
  currentTimeOfDay = TIME_OF_DAY_PRESETS[timeOfDay] ? timeOfDay : 'goldenHour';
  const nextTexture = createSkyTexture(preset);
  if (skyTexture && skyTexture !== nextTexture) skyTexture.dispose();
  skyTexture = nextTexture;
  scene.background = skyTexture;
  scene.fog.color.setHex(preset.fog);
  hemi.color.setHex(preset.hemiSky);
  hemi.intensity = preset.hemiIntensity || 0.65;
  ambient.color.setHex(preset.ambientColor || 0xffeacd);
  ambient.intensity = preset.ambientIntensity;
  sun.color.setHex(preset.sunColor);
  sun.intensity = preset.sunIntensity;
  sun.position.set(...preset.sunPosition);
  fill.color.setHex(preset.fillColor);
  fill.intensity = preset.fillIntensity;
  for (const material of cloudMaterials) {
    material.color.setHex(preset.cloudColor);
    material.opacity = preset.cloudOpacity;
  }
  if (timeOfDaySelect.value !== currentTimeOfDay) timeOfDaySelect.value = currentTimeOfDay;
}

timeOfDaySelect.addEventListener('change', () => applyTimeOfDay(timeOfDaySelect.value));
applyTimeOfDay(currentTimeOfDay);

// Base target scale for the imported landmark and vehicle models.
const BUILDING_SCALE = 1.75;
// Extra emphasis for authored GLB assets (landmarks, ferries and tram).
const IMPORTED_MODEL_SCALE = 2.0;
// Additional scale for the tram system so the vehicle and track cross-section
// read clearly from a distance.
const TRAM_SYSTEM_SCALE = 1.5;
const TRAM_TRACK_RIDE_HEIGHT = (0.8 + 0.12) * TRAM_SYSTEM_SCALE;

// Shared anchors for the imported European-side landmarks.
const LANDMARKS = Object.freeze({
  blueMosque:     { x: -105, z: -110 },
  hagiaSophia:    { x: -116, z:  -15 },
  galataTower:    { x: -98,  z:   65 },
  valensAqueduct: { x: -99,  z:  140 },
  topkapiPalace:  { x:   -4,  z:  110 },
});

// ---------- circular sea & land with a winding Bosphorus ----------
// We carve the Bosphorus out of a circular landmass as a hole in the
// extruded shape, so the curve is genuinely curved (not just a straight
// channel) and the strait shows the sea underneath.
const LAND_RADIUS = 230;
const STRAIT_WEST_HALF = 48;
// Preserve the current asymmetric Bosphorus width while shifting both banks
// together; changing the centreline offset below does not resize the water.
const STRAIT_EAST_HALF = 72;
// In shape coordinates: +Y is north, -Y is south (after rotateX(-π/2),
// shape +Y maps to world -Z).
const STRAIT_SOUTH_Y = -LAND_RADIUS + 30;
const STRAIT_NORTH_Y = +LAND_RADIUS - 30;
const STRAIT_LEN = STRAIT_NORTH_Y - STRAIT_SOUTH_Y; // length along shape-Y axis

// Wavy centerline of the Bosphorus, parameterised 0→1 from south end to north end.
// Two superposed sine waves give a recognisable S-bend plus smaller wiggle.
//
// A constant offset shifts the centreline toward the Asian (positive-X) edge
// of the land, so the strait no longer runs through the middle of the island.
// Hagia Sophia / Galata / the Valens Aqueduct all sit on the European side
// (negative X), so pushing the strait in the +X direction pushes it AWAY from
// them. The bridge, the vapur ferries and the Maiden's Tower all read their
// position from this function, so they shift in lock-step.
const BOSPHORUS_X_OFFSET = 80;
function bosphorusCenterXAtT(t) {
  return 28 * Math.sin(t * Math.PI * 2.0)
       + 15 * Math.sin(t * Math.PI * 1.2 + 0.3)
       + BOSPHORUS_X_OFFSET;
}
function bosphorusCenterXAtShapeY(shapeY) {
  // Keep the same curve outside the main animation range so each shore can
  // continue naturally until it meets the circular edge of the land.
  const t = (shapeY - STRAIT_SOUTH_Y) / STRAIT_LEN;
  return bosphorusCenterXAtT(t);
}
function bosphorusShoreXAtShapeY(shapeY, side) {
  const halfWidth = side < 0 ? STRAIT_WEST_HALF : STRAIT_EAST_HALF;
  return bosphorusCenterXAtShapeY(shapeY) + side * halfWidth;
}

// Locate a shore's exact intersection with the land circle. The first Y is
// known to be inside the circle and the second is at its outer edge; bisection
// avoids hard-coded end-cap positions and keeps the join free of slivers.
function findShoreCircleIntersection(side, insideY, outsideY) {
  const circleDelta = y => {
    const x = bosphorusShoreXAtShapeY(y, side);
    return x * x + y * y - LAND_RADIUS * LAND_RADIUS;
  };

  let inside = insideY;
  let outside = outsideY;
  for (let i = 0; i < 48; i++) {
    const mid = (inside + outside) * 0.5;
    if (circleDelta(mid) <= 0) inside = mid;
    else outside = mid;
  }

  const y = (inside + outside) * 0.5;
  return { x: bosphorusShoreXAtShapeY(y, side), y };
}

const BOSPHORUS_EDGES = {
  westSouth: findShoreCircleIntersection(-1, STRAIT_SOUTH_Y, -LAND_RADIUS),
  westNorth: findShoreCircleIntersection(-1, STRAIT_NORTH_Y,  LAND_RADIUS),
  // The wider east shore lies outside the circle at the old ±200-unit seed,
  // so start these searches from the circle centre, which is safely on land.
  eastSouth: findShoreCircleIntersection( 1, 0, -LAND_RADIUS),
  eastNorth: findShoreCircleIntersection( 1, 0,  LAND_RADIUS),
};

function bosphorusCenterXAtZ(z) {
  // Given a world z, return the shape-x of the centerline at that z (or null).
  // Include the short extrapolated sections where the shores meet the circle.
  const shapeY = -z;
  const southEdge = Math.min(BOSPHORUS_EDGES.westSouth.y, BOSPHORUS_EDGES.eastSouth.y);
  const northEdge = Math.max(BOSPHORUS_EDGES.westNorth.y, BOSPHORUS_EDGES.eastNorth.y);
  if (shapeY < southEdge || shapeY > northEdge) return null;
  return bosphorusCenterXAtShapeY(shapeY);
}
function bosphorusRotationAtT(t) {
  // Bridge / vapur Y-rotation so their long axis aligns with / across the channel.
  // Returns the Y-rotation that puts +X along the channel tangent direction.
  const dt = 0.001;
  const cx1 = bosphorusCenterXAtT(t);
  const cx2 = bosphorusCenterXAtT(Math.min(1, t + dt));
  const dcx = (cx2 - cx1) / dt; // dcx/dt
  // Channel tangent in world XZ: (dcx/dt, -STRAIT_LEN).
  // +X after Y rotation θ becomes (cos θ, 0, -sin θ) in world XZ.
  // Set this parallel to channel tangent → atan2(-(-STRAIT_LEN), dcx/dt)
  //   = atan2(STRAIT_LEN, dcx/dt).
  return Math.atan2(STRAIT_LEN, dcx);
}

// Where each water landmark sits along the strait (0 = south, 1 = north).

const BRIDGE_EAST_OFFSET = (STRAIT_EAST_HALF - STRAIT_WEST_HALF) / 2;

const KIZKULESI_SHORE_OFFSET = STRAIT_EAST_HALF - KIZKULESI_COAST_GAP;

const KIZKULESI_Z = -STRAIT_SOUTH_Y - STRAIT_LEN * KIZKULESI_T;

// Rocky foundation beneath the complete diorama disc. The procedural texture
// is drawn as a tile and repeated around the cylinder, keeping this standalone
// page free of another external asset while still giving the edge real detail.
function createRockTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const rockRng = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(731);

  ctx.fillStyle = '#766452';
  ctx.fillRect(0, 0, size, size);

  // Fine mineral grain softens the broad colour areas.
  for (let i = 0; i < 2600; i++) {
    const shade = 75 + Math.floor(rockRng() * 70);
    ctx.fillStyle = `rgba(${shade}, ${Math.floor(shade * 0.88)}, ${Math.floor(shade * 0.72)}, 0.18)`;
    const grain = 0.5 + rockRng() * 1.5;
    ctx.fillRect(rockRng() * size, rockRng() * size, grain, grain);
  }

  // Draw each larger fragment into neighbouring tiles as well. Features that
  // cross an edge therefore continue cleanly when RepeatWrapping is enabled.
  for (let i = 0; i < 72; i++) {
    const cx = rockRng() * size;
    const cy = rockRng() * size;
    const radius = 5 + rockRng() * 13;
    const points = 5 + Math.floor(rockRng() * 4);
    const shade = 82 + Math.floor(rockRng() * 52);
    const vertices = [];
    for (let p = 0; p < points; p++) {
      const angle = p / points * Math.PI * 2;
      const r = radius * (0.72 + rockRng() * 0.38);
      vertices.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r * 0.65 });
    }

    for (const ox of [-size, 0, size]) {
      for (const oy of [-size, 0, size]) {
        ctx.beginPath();
        for (let p = 0; p < vertices.length; p++) {
          const x = cx + ox + vertices[p].x;
          const y = cy + oy + vertices[p].y;
          if (p === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = `rgba(${shade}, ${Math.floor(shade * 0.86)}, ${Math.floor(shade * 0.68)}, 0.34)`;
        ctx.fill();
        ctx.strokeStyle = 'rgba(55, 44, 35, 0.28)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(10, 2);
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return texture;
}

const ROCK_BASE_HEIGHT = 16;
const rockGeom = new THREE.CylinderGeometry(
  LAND_RADIUS + 2,
  LAND_RADIUS + 3,
  ROCK_BASE_HEIGHT,
  96,
  3
);

// Small periodic offsets break the machine-perfect cylindrical silhouette,
// while the minimum radius remains outside the sea/land circle above it.
const rockPositions = rockGeom.attributes.position;
for (let i = 0; i < rockPositions.count; i++) {
  const x = rockPositions.getX(i);
  const y = rockPositions.getY(i);
  const z = rockPositions.getZ(i);
  const radius = Math.hypot(x, z);
  if (radius < LAND_RADIUS * 0.5) continue; // cap centre vertices
  const angle = Math.atan2(z, x);
  const roughness = 0.85 * Math.sin(angle * 7 + y * 0.12)
                  + 0.5 * Math.sin(angle * 17 - y * 0.2);
  const scale = (radius + roughness) / radius;
  rockPositions.setXYZ(i, x * scale, y, z * scale);
}
rockPositions.needsUpdate = true;
rockGeom.computeVertexNormals();

const rockTexture = createRockTexture();
const rockSideMaterial = new THREE.MeshStandardMaterial({
  map: rockTexture,
  bumpMap: rockTexture,
  bumpScale: 0.7,
  roughness: 1,
  metalness: 0,
  flatShading: true
});
const rockCapMaterial = new THREE.MeshStandardMaterial({ color: 0x6f5d4b, roughness: 1 });
const rockBase = new THREE.Mesh(rockGeom, [rockSideMaterial, rockCapMaterial, rockCapMaterial]);
rockBase.position.y = -1 - ROCK_BASE_HEIGHT / 2;
rockBase.castShadow = true;
rockBase.receiveShadow = true;

// Sea: flat circular disc that sits underneath the land and shows through
// wherever the land has a hole (the Bosphorus). Sized to match the land
// circle exactly so neither land nor sea extends outside the original
// circle that contains the Bosphorus.
const waterMaterial = new THREE.MeshStandardMaterial({
  color: 0x78b9b7,
  roughness: 0.48,
  metalness: 0.04,
});

// Keep the physically lit Standard material, but vary its colour with several
// slowly travelling wave fields. Crossing waves avoid the obvious look of a
// texture sliding in one direction, while the narrow pale crests catch the
// scene lighting like small Bosphorus ripples.
const waterShaderState = { shader: null };
waterMaterial.onBeforeCompile = shader => {
  shader.uniforms.waterTime = { value: 0 };
  shader.vertexShader = shader.vertexShader
    .replace(
      '#include <common>',
      `#include <common>
       varying vec2 vWaterUv;`
    )
    .replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       vWaterUv = uv;`
    );
  shader.fragmentShader = shader.fragmentShader
    .replace(
      '#include <common>',
      `#include <common>
       uniform float waterTime;
       varying vec2 vWaterUv;`
    )
    .replace(
      '#include <map_fragment>',
      `#include <map_fragment>
       vec2 waterUv = vWaterUv;
       float longSwell = sin((waterUv.y * 8.0 + waterUv.x * 2.2) * 6.28318 - waterTime * 0.42);
       float crossRipple = sin((waterUv.x * 13.0 - waterUv.y * 5.0) * 6.28318 + waterTime * 0.63);
       float fineRipple = sin((waterUv.x * 24.0 + waterUv.y * 17.0) * 6.28318 - waterTime * 0.88);
       float waveMix = longSwell * 0.56 + crossRipple * 0.29 + fineRipple * 0.15;
       vec3 troughColour = vec3(0.19, 0.48, 0.53);
       vec3 bodyColour = vec3(0.39, 0.68, 0.68);
       vec3 crestColour = vec3(0.72, 0.84, 0.79);
       vec3 waterColour = mix(troughColour, bodyColour, smoothstep(-0.78, 0.48, waveMix));
       waterColour = mix(waterColour, crestColour, smoothstep(0.68, 0.92, waveMix) * 0.42);
       diffuseColor.rgb *= waterColour / vec3(0.47, 0.73, 0.72);`
    );
  waterShaderState.shader = shader;
};

const sea = new THREE.Mesh(
  new THREE.CircleGeometry(LAND_RADIUS, 96),

sea.rotation.x = -Math.PI / 2;
sea.position.y = 0;

// Land: two shapes bounded by the circle and the corresponding Bosphorus
// shore. A closed hole cannot safely cross an outer Shape boundary, so making
// the European and Asian sides independent leaves a genuine opening to sea.
const STEPS = 90;
function positiveArcEnd(start, end) {
  while (end <= start) end += Math.PI * 2;
  return end;
}

const westLandShape = new THREE.Shape();
const westNorthAngle = Math.atan2(BOSPHORUS_EDGES.westNorth.y, BOSPHORUS_EDGES.westNorth.x);
const westSouthAngle = positiveArcEnd(
  westNorthAngle,
  Math.atan2(BOSPHORUS_EDGES.westSouth.y, BOSPHORUS_EDGES.westSouth.x)
);
westLandShape.moveTo(BOSPHORUS_EDGES.westNorth.x, BOSPHORUS_EDGES.westNorth.y);
westLandShape.absarc(0, 0, LAND_RADIUS, westNorthAngle, westSouthAngle, false);
for (let i = 0; i <= STEPS; i++) {
  const f = i / STEPS;
  const y = THREE.MathUtils.lerp(BOSPHORUS_EDGES.westSouth.y, BOSPHORUS_EDGES.westNorth.y, f);
  westLandShape.lineTo(bosphorusShoreXAtShapeY(y, -1), y);
}
westLandShape.closePath();

const eastLandShape = new THREE.Shape();
const eastSouthAngle = Math.atan2(BOSPHORUS_EDGES.eastSouth.y, BOSPHORUS_EDGES.eastSouth.x);
const eastNorthAngle = positiveArcEnd(
  eastSouthAngle,
  Math.atan2(BOSPHORUS_EDGES.eastNorth.y, BOSPHORUS_EDGES.eastNorth.x)
);
eastLandShape.moveTo(BOSPHORUS_EDGES.eastSouth.x, BOSPHORUS_EDGES.eastSouth.y);
eastLandShape.absarc(0, 0, LAND_RADIUS, eastSouthAngle, eastNorthAngle, false);
for (let i = STEPS; i >= 0; i--) {
  const f = i / STEPS;
  const y = THREE.MathUtils.lerp(BOSPHORUS_EDGES.eastSouth.y, BOSPHORUS_EDGES.eastNorth.y, f);
  eastLandShape.lineTo(bosphorusShoreXAtShapeY(y, 1), y);
}
eastLandShape.closePath();

const landGeom = new THREE.ExtrudeGeometry([westLandShape, eastLandShape], {
  depth: 3,
  bevelEnabled: false,
  curveSegments: 96
});
landGeom.rotateX(-Math.PI / 2); // shape +Y → world -Z; extrusion becomes world +Y
const land = new THREE.Mesh(
  landGeom,
  // Sage-green landmass — slightly warmer than pure sage so the whole
  // island glows gently under the golden-hour sun.
  new THREE.MeshStandardMaterial({ color: 0xc4cea0, roughness: 0.95 })
);
land.position.y = 2;
const LAND_SURFACE_Y = land.position.y + 3; // upward-facing extruded cap
land.receiveShadow = true;
scene.add(land);

// Cobblestone precincts break up the continuous green land and give each
// historic landmark a readable paved setting without another external asset.
function createCobblestoneTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  let seed = 9187;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  ctx.fillStyle = '#e8ddc7';
  ctx.fillRect(0, 0, size, size);
  const rows = 9;
  const cols = 9;
  const cellW = size / cols;
  const cellH = size / rows;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const cx = (col + 0.5 + (row % 2) * 0.18) * cellW + (random() - 0.5) * 9;
      const cy = (row + 0.5) * cellH + (random() - 0.5) * 8;
      const w = cellW * (0.72 + random() * 0.2);
      const h = cellH * (0.64 + random() * 0.22);
      const shade = 216 + Math.floor(random() * 28);
      ctx.fillStyle = `rgb(${shade}, ${shade - 6}, ${shade - 18})`;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 4);
      else ctx.rect(cx - w / 2, cy - h / 2, w, h);
      ctx.fill();
      ctx.strokeStyle = 'rgba(113, 91, 67, 0.34)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(1, 1);
  return texture;
}

const cobblestoneTexture = createCobblestoneTexture();
const cobblestoneMaterial = new THREE.MeshStandardMaterial({

  color: 0xfff1d6,
  emissive: 0x3a2d20,
  emissiveIntensity: 0.08,

});
const pavedPrecincts = [

  },

    points: [[-64, -38], [-48, -55], [-22, -50], [0, -62], [22, -50], [48, -55], [64, -38],
             [64, 34], [47, 52], [22, 47], [0, 58], [-22, 47], [-47, 52], [-64, 34]],
  },
  {
    x: LANDMARKS.galataTower.x, z: LANDMARKS.galataTower.z, rotation: 0,
    points: [[-25, -10], [-10, -25], [10, -25], [25, -10], [25, 10], [10, 25], [-10, 25], [-25, 10]],
  },
  {
    x: LANDMARKS.valensAqueduct.x, z: LANDMARKS.valensAqueduct.z, rotation: 2.1,
    points: [[-78, -16], [76, -16], [86, -8], [86, 8], [76, 16], [-78, 16], [-86, 8], [-86, -8]],
  },
  {
    x: LANDMARKS.topkapiPalace.x, z: LANDMARKS.topkapiPalace.z,
    rotation: THREE.MathUtils.degToRad(80),
    points: [[-68, -46], [-34, -62], [18, -59], [62, -40], [72, 5], [56, 52], [14, 64], [-36, 57], [-70, 28]],
  },
];

function createPrecinctGeometry(points) {
  const shape = new THREE.Shape();
  // Shape +Y maps to world -Z after rotation, hence the negated local Z.
  shape.moveTo(points[0][0], -points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], -points[i][1]);
  shape.closePath();

  const geometry = new THREE.ShapeGeometry(shape);
  const positions = geometry.attributes.position;
  const uvs = geometry.attributes.uv;
  // World-scaled UVs keep individual cobbles the same size on every custom
  // footprint, regardless of whether the precinct is long, square or round.
  for (let i = 0; i < positions.count; i++) {
    uvs.setXY(i, positions.getX(i) / 48, positions.getY(i) / 48);
  }
  uvs.needsUpdate = true;
  geometry.rotateX(-Math.PI / 2);
  return geometry;
}

for (const precinct of pavedPrecincts) {
  const road = new THREE.Mesh(
    createPrecinctGeometry(precinct.points),
    cobblestoneMaterial
  );
  road.position.set(precinct.x, LAND_SURFACE_Y + 0.12, precinct.z);
  road.rotation.y = precinct.rotation;
  road.renderOrder = 2;
  road.receiveShadow = true;
  scene.add(road);
}

// Deterministic randomness for the gull animation.
const rng = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(42);

// ---------- Bosphorus Bridge — loaded from GLB ----------
// The source model's long axis runs along +X. We scale it so its long
// axis is ~58 units (spanning the curved strait with a little overhang)
// and rotate the parent group to align it perpendicular to the local
// channel direction at BRIDGE_T.
const bridgeGroup = new THREE.Group();
bridgeGroup.position.set(
  bosphorusCenterXAtT(BRIDGE_T) + BRIDGE_EAST_OFFSET,
  2,
  -STRAIT_SOUTH_Y - STRAIT_LEN * BRIDGE_T
);
bridgeGroup.rotation.y = bosphorusRotationAtT(BRIDGE_T) - Math.PI / 2;
scene.add(bridgeGroup);

{
  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    '/assets/models/suspension-bridge.glb',
    (gltf) => {
      const model = gltf.scene;
      // 1) measure the unscaled model
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      // 2) uniform scale so the long axis crosses the strait
      const target = 58 * BUILDING_SCALE;
      const s = rawSize.x > 0 ? target / rawSize.x : 1;
      model.scale.setScalar(s * IMPORTED_MODEL_SCALE);
      // 3) re-measure (scale + rotation included), then center horizontally
      //    and plant the base at local y=0
      const box = new THREE.Box3().setFromObject(model);
      model.position.x -= (box.min.x + box.max.x) / 2;
      model.position.z -= (box.min.z + box.max.z) / 2;
      model.position.y -= box.min.y;
      // 4) enable shadows on every mesh in the model
      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      bridgeGroup.add(model);
    },
    undefined,
    (err) => console.error('Failed to load bridge model:', err)
  );
}

// ---------- Kızkulesi (Maiden's Tower) — loaded from GLB ----------
// Sits in the Bosphorus near the south end, close to the Asian shore where
// the real tower stands (see KIZKULESI_X/Z above).
const kizkulesiGroup = new THREE.Group();
kizkulesiGroup.position.set(KIZKULESI_X, 0, KIZKULESI_Z);
scene.add(kizkulesiGroup);

const KIZKULESI_TARGET_FOOTPRINT = 20 * BUILDING_SCALE;
const KIZKULESI_BIRD_CLEARANCE = 12;
// Safe loading-time fallback; replaced with the model's measured height once
// the GLB is ready so future tower scale changes also raise the birds.
let kizkulesiBirdBaseY = KIZKULESI_TARGET_FOOTPRINT * IMPORTED_MODEL_SCALE
                       + KIZKULESI_BIRD_CLEARANCE;
let gullPickVolume = null;
let kizkulesiFlagMesh = null;

{
  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    '/assets/models/maidens-tower.glb',
    (gltf) => {
      const model = gltf.scene;
      // 1) measure the unscaled model
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      // 2) make the tower 25% larger than its previous 16-unit base target
      const longest = Math.max(rawSize.x, rawSize.z);
      const target = KIZKULESI_TARGET_FOOTPRINT;
      const s = longest > 0 ? Math.min(target / longest, 50) : 1;
      model.scale.setScalar(s * IMPORTED_MODEL_SCALE);
      // 3) re-measure (the scale is now baked into the world-space box),
      //    then center horizontally and plant the base at local y=0
      const box = new THREE.Box3().setFromObject(model);
      model.position.x -= (box.min.x + box.max.x) / 2;
      model.position.z -= (box.min.z + box.max.z) / 2;
      model.position.y -= box.min.y;
      kizkulesiBirdBaseY = box.max.y - box.min.y + KIZKULESI_BIRD_CLEARANCE;
      if (gullPickVolume) gullPickVolume.position.y = kizkulesiBirdBaseY + 7.5;
      // 4) enable shadows on every mesh in the model
      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;

const landmarkDialog = document.getElementById('landmark-dialog');
const landmarkTitle = document.getElementById('landmark-title');
const landmarkDescription = document.getElementById('landmark-description');
const landmarkRaycaster = new THREE.Raycaster();
const landmarkPointer = new THREE.Vector2();
let landmarkPointerDown = null;

function landmarkAtClientPoint(clientX, clientY) {
  const bounds = dom.getBoundingClientRect();
  landmarkPointer.set(
    (clientX - bounds.left) / bounds.width * 2 - 1,
    -(clientY - bounds.top) / bounds.height * 2 + 1
  );
  landmarkRaycaster.setFromCamera(landmarkPointer, camera);
  const hit = landmarkRaycaster.intersectObjects(clickableLandmarkGroups, true)[0];
  if (!hit) return null;

  let object = hit.object;
  while (object) {
    if (object.userData.landmarkId) return LANDMARK_DETAILS[object.userData.landmarkId];
    object = object.parent;
  }
  return null;
}

function showLandmarkDialog(landmark) {
  landmarkTitle.textContent = landmark.title;
  landmarkDescription.textContent = landmark.description;
  controls.enabled = false;
  if (!landmarkDialog.open) landmarkDialog.showModal();
}

dom.addEventListener('pointerdown', (event) => {
  if (!event.isPrimary || event.button !== 0) return;
  landmarkPointerDown = { id: event.pointerId, x: event.clientX, y: event.clientY };
});

dom.addEventListener('pointerup', (event) => {
  const start = landmarkPointerDown;
  landmarkPointerDown = null;
  if (!start || start.id !== event.pointerId) return;
  if (Math.hypot(event.clientX - start.x, event.clientY - start.y) > 7) return;

  const landmark = landmarkAtClientPoint(event.clientX, event.clientY);
  if (landmark) showLandmarkDialog(landmark);
});

dom.addEventListener('pointercancel', () => {
  landmarkPointerDown = null;
});

dom.addEventListener('pointermove', (event) => {
  if (event.pointerType !== 'mouse' || event.buttons !== 0) return;
  dom.style.cursor = landmarkAtClientPoint(event.clientX, event.clientY) ? 'pointer' : 'grab';
});

dom.addEventListener('pointerleave', () => {
  dom.style.cursor = '';
});

landmarkDialog.addEventListener('click', (event) => {
  if (event.target === landmarkDialog) landmarkDialog.close();
});

landmarkDialog.addEventListener('close', () => {
  controls.enabled = true;
});

      const longest = Math.max(rawSize.x, rawSize.y, rawSize.z);

      template.scale.setScalar(s * IMPORTED_MODEL_SCALE);
      // 3) re-measure (the scale is now baked into the world-space box),
      //    then center horizontally and plant the base at local y=0
      const box = new THREE.Box3().setFromObject(template);
      template.position.x -= (box.min.x + box.max.x) / 2;
      template.position.z -= (box.min.z + box.max.z) / 2;
      template.position.y -= box.min.y;
      // 4) enable shadows on every mesh in the template (clones inherit)
      template.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      // 5) spawn two vapurs, each on its own lateral lane offset from the
      //    centerline so their routes never cross and they can't collide.
      //    The narrow western half is 48 and the vapur is ~14 long, so ±12 keeps a
      //    safe gap between the two lanes while staying well clear of shore.
      const VAPUR_LANES = [
        { t: 0.30, speed: 0.00070, dir:  1, lane:  12 }, // north-bound, east lane
        { t: 0.80, speed: 0.00065, dir: -1, lane: -12 }, // south-bound, west lane
      ];
      for (const [index, cfg] of VAPUR_LANES.entries()) {
        const b = template.clone();
        b.userData = { t: cfg.t, speed: cfg.speed, dir: cfg.dir, lane: cfg.lane };
        b.traverse((obj) => {
          if (!b.userData.flagMorphMesh && obj.isMesh && obj.morphTargetInfluences?.length >= 2) {
            b.userData.flagMorphMesh = obj;
          }
        });
        b.userData.flagPhase = index * Math.PI;
        registerClickableObject(b, 'pasabahceFerry');
        boats.push(b);
        scene.add(b);
      }
    },
    undefined,
    (err) => console.error('Failed to load vapur model:', err)
  );

// ---------- tram & tramway ----------
// The track follows the closed tramCurve declared above. We sample the loop at
// small intervals and lay short segments (bed, rails and sleepers) along each
// tangent.
const trackGroup = new THREE.Group();
{
  const TRACK_STEP   = 1.0;   // length of each straight segment along the curve
  const RAIL_GAUGE   = 1.55 * TRAM_SYSTEM_SCALE;  // half-distance between the two rails
  const BED_WIDTH    = 4.2  * TRAM_SYSTEM_SCALE;
  const BED_HEIGHT   = 0.8  * TRAM_SYSTEM_SCALE;
  const RAIL_HEIGHT  = 0.12 * TRAM_SYSTEM_SCALE;
  const RAIL_WIDTH   = 0.22 * TRAM_SYSTEM_SCALE;
  const SLEEPER_WIDTH = 0.32 * TRAM_SYSTEM_SCALE;
  const SLEEPER_HEIGHT = 0.08 * TRAM_SYSTEM_SCALE;
  const SLEEPER_PITCH = 2.2;  // one sleeper roughly every 2.2 world units

  const totalLen = tramCurve.getLength();
  const segCount = Math.max(2, Math.ceil(totalLen / TRACK_STEP));
  // Tick off every Nth segment to place a sleeper so the spacing in world
  // units comes out close to SLEEPER_PITCH.
  const sleeperEvery = Math.max(1, Math.round(SLEEPER_PITCH / TRACK_STEP));

  // Warm walnut track bed, brushed-pewter rails, honey sleepers — the tram
  // reads as a quiet pastel line threading the city rather than a hard
  // industrial stripe.
  const bedMat = new THREE.MeshStandardMaterial({ color: 0x5a4d40, roughness: 0.95 });
  const railMat = new THREE.MeshStandardMaterial({ color: 0xb5a89a, roughness: 0.65, metalness: 0.35 });
  const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x6b4a30, roughness: 0.9 });

  for (let i = 0; i < segCount; i++) {
    const t0 = i / segCount;
    const t1 = (i + 1) / segCount;
    const p0 = tramCurve.getPoint(t0);
    const p1 = tramCurve.getPoint(t1);
    const len = p0.distanceTo(p1);
    if (len < 0.01) continue;
    const mid = p0.clone().add(p1).multiplyScalar(0.5);
    // Y-rotation so the local +X axis (the bed's long edge) lies along the
    // segment's world tangent. Three.js Y-rotation turns +X toward -Z for
    // positive angles, hence the negated z-component.
    const angle = Math.atan2(-(p1.z - p0.z), p1.x - p0.x);

    const seg = new THREE.Group();
    seg.position.set(mid.x, mid.y, mid.z);
    seg.rotation.y = angle;
    trackGroup.add(seg);

    const bed = new THREE.Mesh(
      new THREE.BoxGeometry(len + 0.02, BED_HEIGHT, BED_WIDTH),
      bedMat
    );
    bed.position.y = BED_HEIGHT / 2;
    bed.receiveShadow = true;
    seg.add(bed);

    for (const off of [-RAIL_GAUGE, RAIL_GAUGE]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(len + 0.02, RAIL_HEIGHT, RAIL_WIDTH),
        railMat
      );
      rail.position.set(0, BED_HEIGHT + RAIL_HEIGHT / 2, off);
      rail.castShadow = true;
      rail.receiveShadow = true;
      seg.add(rail);
    }

    if (i % sleeperEvery === 0) {
      const sleeper = new THREE.Mesh(
        new THREE.BoxGeometry(SLEEPER_WIDTH, SLEEPER_HEIGHT, BED_WIDTH + 0.2 * TRAM_SYSTEM_SCALE),
        sleeperMat
      );
      sleeper.position.set(0, BED_HEIGHT - SLEEPER_HEIGHT / 2, 0);
      sleeper.receiveShadow = true;
      seg.add(sleeper);
    }
  }
}
scene.add(trackGroup);

  gulls.add(gull);
}
registerClickableObject(gulls, 'marti');
gulls.position.set(KIZKULESI_X, 0, KIZKULESI_Z);

// A transparent shared hit area makes the small, moving birds easy to select
// without changing their visible geometry or animation.
gullPickVolume = new THREE.Mesh(
  new THREE.SphereGeometry(24, 16, 10),
  new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
);
gullPickVolume.position.set(KIZKULESI_X, kizkulesiBirdBaseY + 7.5, KIZKULESI_Z);
scene.add(gullPickVolume);
registerClickableObject(gullPickVolume, 'marti');
scene.add(gulls);

// ---------- animation loop ----------
function tick(now = performance.now()) {
  requestAnimationFrame(tick);
  if (waterShaderState.shader) {
    waterShaderState.shader.uniforms.waterTime.value = now * 0.001;
  }
  const cloudTime = now * 0.001;
  for (const cloud of clouds) {
    const { basePosition, driftPhase, driftSpeed } = cloud.userData;
    const drift = cloudTime * driftSpeed + driftPhase;
    cloud.position.x = basePosition.x + Math.sin(drift) * 10;
    cloud.position.z = basePosition.z + Math.cos(drift * 0.72) * 4;
    cloud.position.y = basePosition.y + Math.sin(drift * 1.4) * 1.5;
  }
  for (const b of boats) {
    b.userData.t += b.userData.speed * b.userData.dir;
    if (b.userData.t > 1) b.userData.t -= 1;
    if (b.userData.t < 0) b.userData.t += 1;
    // Lane offset keeps each vapur on its own parallel route; the channel's
    // X-wiggle is small enough that a constant X shift reads as a separate lane.
    b.position.x = bosphorusCenterXAtT(b.userData.t) + (b.userData.lane || 0);
    b.position.z = -STRAIT_SOUTH_Y - STRAIT_LEN * b.userData.t;
    // Turn the northbound vapur around so its flag sits at the rear.
    b.rotation.y = bosphorusRotationAtT(b.userData.t)
                 + (b.userData.dir > 0 ? Math.PI : 0);
    const flagMesh = b.userData.flagMorphMesh;
    if (flagMesh) {
      const wavePhase = now * (Math.PI * 2 / 1150) + b.userData.flagPhase;
      flagMesh.morphTargetInfluences[0] = Math.cos(wavePhase);
      flagMesh.morphTargetInfluences[1] = Math.sin(wavePhase);
    }
  }
  if (kizkulesiFlagMesh) {
    const wavePhase = now * (Math.PI * 2 / 1350);
    kizkulesiFlagMesh.morphTargetInfluences[0] = Math.cos(wavePhase);
    kizkulesiFlagMesh.morphTargetInfluences[1] = Math.sin(wavePhase);
  }
  if (tramReady) {
    tramT = (tramT + TRAM_SPEED) % 1;
    const p = tramCurve.getPoint(tramT);
    const tan = tramCurve.getTangent(tramT);
    // Face continuously along the cyclic route's tangent.
    tramGroup.position.set(p.x, p.y + TRAM_TRACK_RIDE_HEIGHT, p.z);
    tramGroup.rotation.y = Math.atan2(-tan.z, tan.x);
  }
  for (const gull of gulls.children) {
    const u = gull.userData;
    u.a += 0.02 * u.s;
    u.flap += 0.18;
    gull.position.set(
      Math.cos(u.a) * u.r,
      kizkulesiBirdBaseY + u.yOffset + Math.sin(u.a * 3) * 0.8,
      Math.sin(u.a) * u.r
    );
    gull.rotation.y = -u.a;
    gull.children[1].rotation.z = Math.sin(u.flap) * 0.7;
  gull.children[2].rotation.z = -Math.sin(u.flap) * 0.7;
  }
  controls.update();
  renderer.render(scene, camera);
  updateDebugPanel(now);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
