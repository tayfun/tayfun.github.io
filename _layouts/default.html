<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e8ea0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    // Apply a stored theme override before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feeds/posts/default.atom' | absolute_url }}">
  {%- seo title=false -%}
</head>
<body class="layout--{{ page.layout | default: 'default' }}">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header" role="banner">
    <canvas class="site-header__gol" id="header-gol" aria-hidden="true" focusable="false"></canvas>
    <div class="site-header__inner">
      <a class="site-header__brand" href="{{ '/' | relative_url }}">
        <img class="site-header__logo" src="{{ '/assets/images/initials.png' | relative_url }}" alt="" loading="lazy" decoding="async">
        <span class="site-header__text">
          <span class="site-header__title">{{ site.title | escape }}</span>
          {%- if site.tagline %}
          <span class="site-header__tagline">{{ site.tagline | escape }}</span>
          {%- endif %}
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Blog</a></li>
          <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' or page.url == '/about.html' %} aria-current="page"{% endif %}>About</a></li>
          <li><a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' or page.url == '/tags.html' %} aria-current="page"{% endif %}>Tags</a></li>
          <li>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
              <svg class="icon theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <svg class="icon theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content" class="site-main" role="main">
    {{ content }}
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer__inner">
      <p>
        &copy; <span id="footername">{{ site.author | escape }}</span> {{ site.time | date: '%Y' }}.
      </p>
      <p class="site-footer__meta">
        Powered by <a href="https://jekyllrb.com/">Jekyll</a>.
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/game-of-life.js' | relative_url }}" defer></script>
</body>
</html>
