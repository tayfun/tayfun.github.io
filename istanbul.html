<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Istanbul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #aee3f5; font-family: sans-serif; }
  #info { position: absolute; top: 12px; left: 12px; color: #234; background: rgba(255,255,255,.75);
          padding: 8px 12px; border-radius: 8px; font-size: 13px; user-select: none; }
</style>
</head>
<body>
<div id="info">🏙️ Istanbul — drag (or 2‑finger ↔) to orbit · scroll (or 2‑finger ↕) to zoom</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- scene basics ----------
const scene = new THREE.Scene();
scene.scale.setScalar(5.0);
scene.background = new THREE.Color(0xaee3f5);
scene.fog = null;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 6000);
// Pulled back and up so the camera sits just outside the (5×-scaled) land
// disc and looks diagonally at the scene, rather than hovering low over
// the Bosphorus and looking straight down the water.
camera.position.set(900, 1100, 1100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
// Pivot on the European side (where the mosques, Galata and the aqueduct
// cluster) instead of the strait centerline, so the initial framing
// foregrounds the city rather than the Bosphorus.
controls.target.set(-60, 10, -40);
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 60;
controls.maxDistance = 2500;
controls.enableDamping = true;
// Each scroll tick / pinch step moves the camera further along the dolly axis.
controls.zoomSpeed = 4.0;

// ---------- custom touch handling ----------
// OrbitControls already drives single-finger drag for rotation. For
// two-finger gestures we override the default so that:
//   - horizontal swipe → orbit (rotate)
//   - vertical swipe   → dolly (zoom in / zoom out)
//   - pinch (spread)   → zoom (same direction as the vertical dolly)
// We register on document with capture:true so these listeners fire
// BEFORE OrbitControls' target listeners on the canvas; calling
// stopPropagation then keeps OrbitControls from also handling the same
// gesture.
const dom = renderer.domElement;
const twoFinger = { active: false, mode: null, cx: 0, cy: 0, startDist: 0 };

// OrbitControls in three@0.160 does NOT expose rotateLeft / dollyIn /
// dollyOut / getDollyScale on `this` — they're closure-internal. We
// apply rotations and dolly directly to the camera position; the next
// controls.update() tick re-syncs from there. The math matches what
// OrbitControls does internally (rotate around camera.up, which is the
// default world (0,1,0) in this scene).
const _camOffset = new THREE.Vector3();
const _worldUp = new THREE.Vector3(0, 1, 0);

function rotateHorizontal(dx) {
  // Same magnitude formula OrbitControls uses for mouse-drag rotate.
  // The sign is flipped so applyAxisAngle produces the same direction
  // as OrbitControls' rotateLeft(positive) — clockwise around +Y.
  const angle = 2 * Math.PI * dx / dom.clientHeight;
  _camOffset.copy(camera.position).sub(controls.target);
  _camOffset.applyAxisAngle(_worldUp, -angle);
  camera.position.copy(controls.target).add(_camOffset);
}

function dollyBy(dy) {
  // dy > 0 (drag down) → zoom out
  // dy < 0 (drag up)   → zoom in
  const dollyDelta = (Math.abs(dy) / dom.clientHeight) * 20;
  const dollyScale = Math.pow(0.95, dollyDelta);
  _camOffset.copy(camera.position).sub(controls.target);
  if (dy > 0) _camOffset.multiplyScalar(1 / dollyScale);
  else        _camOffset.multiplyScalar(dollyScale);
  // Respect OrbitControls' min/max distance clamps
  const clamped = Math.max(controls.minDistance,
                  Math.min(controls.maxDistance, _camOffset.length()));
  _camOffset.setLength(clamped);
  camera.position.copy(controls.target).add(_camOffset);
}

function pinchBy(curDist, startDist) {
  const scale = curDist / startDist;
  _camOffset.copy(camera.position).sub(controls.target);
  _camOffset.multiplyScalar(1 / scale);
  const clamped = Math.max(controls.minDistance,
                  Math.min(controls.maxDistance, _camOffset.length()));
  _camOffset.setLength(clamped);
  camera.position.copy(controls.target).add(_camOffset);
}

function tsStart(e) {
  if (e.target !== dom || e.touches.length !== 2) return;
  e.preventDefault();
  e.stopPropagation();
  const t0 = e.touches[0], t1 = e.touches[1];
  twoFinger.active = true;
  twoFinger.mode = null;
  twoFinger.startDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  twoFinger.cx = (t0.clientX + t1.clientX) / 2;
  twoFinger.cy = (t0.clientY + t1.clientY) / 2;
}

function tsMove(e) {
  if (!twoFinger.active || e.touches.length !== 2) return;
  e.preventDefault();
  e.stopPropagation();
  const t0 = e.touches[0], t1 = e.touches[1];
  const cx = (t0.clientX + t1.clientX) / 2;
  const cy = (t0.clientY + t1.clientY) / 2;
  const curDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  const dx = cx - twoFinger.cx;
  const dy = cy - twoFinger.cy;

  // Lock the gesture to its dominant flavour on the first move
  if (twoFinger.mode === null) {
    const distChange = Math.abs(curDist - twoFinger.startDist);
    if (distChange > 10)            twoFinger.mode = 'pinch';
    else if (Math.abs(dx) > Math.abs(dy)) twoFinger.mode = 'rotate';
    else                             twoFinger.mode = 'dolly';
  }

  if (twoFinger.mode === 'rotate') {
    rotateHorizontal(dx);
  } else if (twoFinger.mode === 'dolly') {
    dollyBy(dy);
  } else { // pinch
    pinchBy(curDist, twoFinger.startDist);
    twoFinger.startDist = curDist; // incremental so each move scales from the last
  }

  twoFinger.cx = cx;
  twoFinger.cy = cy;
}

function tsEnd(e) {
  if (twoFinger.active && e.touches.length < 2) {
    twoFinger.active = false;
    twoFinger.mode = null;
  }
}

document.addEventListener('touchstart',  tsStart, { passive: false, capture: true });
document.addEventListener('touchmove',   tsMove,  { passive: false, capture: true });
document.addEventListener('touchend',    tsEnd,   { capture: true });
document.addEventListener('touchcancel', tsEnd,   { capture: true });

// ---------- horizontal trackpad / wheel handling ----------
// On a trackpad (or Magic Mouse), a two-finger horizontal swipe arrives
// as a `wheel` event with a non-zero deltaX — not as touch events.
// Firefox and some Linux setups instead send horizontal motion as
// vertical wheel + Shift. We catch both, while leaving vertical wheel
// and pinch (ctrl+wheel) zoom for OrbitControls to handle.
//
// Registered on `document` with `capture:true` so we run BEFORE
// OrbitControls' own canvas wheel listener; `stopPropagation` then
// stops the gesture from being doubled as a zoom.
document.addEventListener('wheel', (e) => {
  // Pinch on macOS trackpad: ctrlKey + deltaY. Pass through to OrbitControls.
  if (e.ctrlKey) return;

  // Horizontal-dominant wheel (macOS / Windows / Magic Mouse trackpads)
  if (e.deltaX !== 0 && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    e.preventDefault();
    e.stopPropagation();
    rotateHorizontal(e.deltaX);
    return;
  }

  // Shift+vertical wheel (Firefox / some Linux setups treat this as horizontal)
  if (e.shiftKey && e.deltaX === 0 && e.deltaY !== 0) {
    e.preventDefault();
    e.stopPropagation();
    rotateHorizontal(e.deltaY);
    return;
  }

  // Anything else (plain vertical wheel / pinch handled above) — let
  // OrbitControls deal with it as a zoom.
}, { passive: false, capture: true });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff3d6, 1.5);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -280; sun.shadow.camera.right = 280;
sun.shadow.camera.top = 280; sun.shadow.camera.bottom = -280;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc4d8ff, 0.35);
fill.position.set(-50, 30, -40);
scene.add(fill);

// ---------- palette ----------
const COLORS = {
  red: 0xc4281c, blue: 0x0d69ab, yellow: 0xf2cd37, green: 0x237841,
  white: 0xf4f4f4, cream: 0xeedfb5, tan: 0xe4cd9e, gray: 0x9ba19d,
  darkgray: 0x6c6e68, darkred: 0x8a2a1e, brown: 0x7b5d41,
  orange: 0xfe8a18, pink: 0xfc97ac, teal: 0x008f9b, gold: 0xc5a224,
  domered: 0xa44a3c, stone: 0xc9b58a, window: 0x7fb6d9,
  roofred: 0x8a2a1e, darkwood: 0x4a3623, grass: 0x2f8a4e,
  door: 0x3a2a1c
};

// Global scale factor for every building, the bridge, and towers.
// Applied uniformly so the city stays readable while everything is bigger.
const BUILDING_SCALE = 1.5;

// ---------- helpers ----------
// A solid block — base at group y=0, top at y=h. No studs.
function block(w, h, d, color, opts = {}) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.roughness ?? 0.75, metalness: opts.metalness ?? 0.04
  });
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  box.position.y = h / 2;
  box.castShadow = box.receiveShadow = true;
  g.add(box);
  g.userData.mat = mat;
  return g;
}

// Window grid applied to a box at group origin (base y=0, top y=h)
function addWindows(g, w, h, d, color = COLORS.window, floors = null) {
  const winW = 0.55, winH = 0.75, winD = 0.05;
  const winMat = new THREE.MeshStandardMaterial({
    color, roughness: 0.25, metalness: 0.4,
    emissive: color, emissiveIntensity: 0.25
  });
  const fl = floors ?? Math.max(1, Math.floor((h - 1) / 1.5));
  const yStart = 1.0;
  const usable = Math.max(0.5, h - yStart - 0.4);
  const step = usable / fl;
  const colsX = Math.max(1, Math.round(w / 1.3));
  const colsZ = Math.max(1, Math.round(d / 1.3));
  for (let r = 0; r < fl; r++) {
    const y = yStart + r * step + step / 2;
    for (let i = 0; i < colsX; i++) {
      const x = -w / 2 + (i + 0.5) * (w / colsX);
      for (const sign of [-1, 1]) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(winW, winH, winD), winMat);
        win.position.set(x, y, sign * (d / 2 + 0.02));
        g.add(win);
      }
    }
    for (let i = 0; i < colsZ; i++) {
      const z = -d / 2 + (i + 0.5) * (d / colsZ);
      for (const sign of [-1, 1]) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(winD, winH, winW), winMat);
        win.position.set(sign * (w / 2 + 0.02), y, z);
        g.add(win);
      }
    }
  }
}

// Small pyramidal roof on top of a block whose top is at baseY
function addPyramid(g, w, d, baseY, color, height = null) {
  const roofH = height ?? Math.min(2.5, Math.min(w, d) * 0.65);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(Math.hypot(w, d) * 0.5 + 0.2, roofH, 4),
    new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
  );
  roof.position.y = baseY + roofH / 2;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
}

// Flat parapet raised on the edge of a block whose top is at baseY
function addParapet(g, w, d, baseY, color, thickness = 0.3) {
  const par = new THREE.Mesh(
    new THREE.BoxGeometry(w + thickness * 2, thickness, d + thickness * 2),
    new THREE.MeshStandardMaterial({ color, roughness: 0.8 })
  );
  par.position.y = baseY + thickness / 2;
  par.castShadow = true;
  g.add(par);
}

// A hemispherical dome with base ring and gold finial. Sits at local y = baseY.
function dome(radius, color, baseY, height = null) {
  const g = new THREE.Group();
  const h = height ?? radius * 0.7;
  const d = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 24, 14, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color, roughness: 0.55 })
  );
  d.position.y = baseY;
  d.castShadow = true;
  g.add(d);
  // base ring (drum)
  const ring = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 1.04, radius * 1.04, 0.35, 24),
    new THREE.MeshStandardMaterial({ color: COLORS.cream, roughness: 0.7 })
  );
  ring.position.y = baseY - 0.18;
  g.add(ring);
  // gold finial: stem + orb + spike
  const finialMat = new THREE.MeshStandardMaterial({ color: COLORS.gold, metalness: 0.65, roughness: 0.35 });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 0.8, 8), finialMat);
  stem.position.y = baseY + h + 0.4;
  g.add(stem);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), finialMat);
  orb.position.y = baseY + h + 0.95;
  g.add(orb);
  const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.6, 6), finialMat);
  spike.position.y = baseY + h + 1.4;
  g.add(spike);
  return g;
}

// ---------- circular sea & land with a winding Bosphorus ----------
// We carve the Bosphorus out of a circular landmass as a hole in the
// extruded shape, so the curve is genuinely curved (not just a straight
// channel) and the strait shows the sea underneath.
const LAND_RADIUS = 230;
const STRAIT_HALF = 48;
// In shape coordinates: +Y is north, -Y is south (after rotateX(-π/2),
// shape +Y maps to world -Z).
const STRAIT_SOUTH_Y = -LAND_RADIUS + 30;
const STRAIT_NORTH_Y = +LAND_RADIUS - 30;
const STRAIT_LEN = STRAIT_NORTH_Y - STRAIT_SOUTH_Y; // length along shape-Y axis

// Wavy centerline of the Bosphorus, parameterised 0→1 from south end to north end.
// Two superposed sine waves give a recognisable S-bend plus smaller wiggle.
function bosphorusCenterXAtT(t) {
  return 28 * Math.sin(t * Math.PI * 2.0)
       + 15 * Math.sin(t * Math.PI * 1.2 + 0.3);
}
function bosphorusCenterXAtZ(z) {
  // Given a world z, return the shape-x of the centerline at that z (or null).
  // shape-y = -world-z, normalised to t ∈ [0,1] over the strait's length.
  const shapeY = -z;
  const t = (shapeY - STRAIT_SOUTH_Y) / STRAIT_LEN;
  if (t < -0.02 || t > 1.02) return null;
  return bosphorusCenterXAtT(Math.max(0, Math.min(1, t)));
}
function bosphorusRotationAtT(t) {
  // Bridge / vapur Y-rotation so their long axis aligns with / across the channel.
  // Returns the Y-rotation that puts +X along the channel tangent direction.
  const dt = 0.001;
  const cx1 = bosphorusCenterXAtT(t);
  const cx2 = bosphorusCenterXAtT(Math.min(1, t + dt));
  const dcx = (cx2 - cx1) / dt; // dcx/dt
  // Channel tangent in world XZ: (dcx/dt, -STRAIT_LEN).
  // +X after Y rotation θ becomes (cos θ, 0, -sin θ) in world XZ.
  // Set this parallel to channel tangent → atan2(-(-STRAIT_LEN), dcx/dt)
  //   = atan2(STRAIT_LEN, dcx/dt).
  return Math.atan2(STRAIT_LEN, dcx);
}

// Where each landmark sits along the strait's parameter t (0 = south, 1 = north).
// Declared here so the building scatter (which comes next) can carve out plazas
// around them by calling bosphorusCenterXAtT().
const BRIDGE_T = 0.62;
const KIZKULESI_T = 0.22;
// The real Kızkulesi sits just off the Üsküdar (Asian, +X) shore rather than
// mid-channel, so push it away from the centerline towards that shore.
const KIZKULESI_SHORE_OFFSET = STRAIT_HALF * 0.7;
const KIZKULESI_X = bosphorusCenterXAtT(KIZKULESI_T) + KIZKULESI_SHORE_OFFSET;
const KIZKULESI_Z = -STRAIT_SOUTH_Y - STRAIT_LEN * KIZKULESI_T;

// Tram route: a winding path along the European side of the land, running
// from the southern edge to the northern edge. Declared early so the
// building scatter (which runs just below the strait code) can keep cells
// off the track via distToPolyline().
const TRAM_PATH = [
  new THREE.Vector3( -60, 6, +190), // south end (near the southern shore)
  new THREE.Vector3(-130, 6, +140),
  new THREE.Vector3(-185, 6,  +80),
  new THREE.Vector3(-130, 6,  +10),
  new THREE.Vector3(-190, 6,  -50),
  new THREE.Vector3(-140, 6, -110),
  new THREE.Vector3(-140, 6, -170),
  new THREE.Vector3( -80, 6, -200), // north end (near the northern shore)
];
// Endpoint aliases, kept so the stop markers and initial tram placement
// don't need to know about the full polyline.
const TRAM_A = TRAM_PATH[0];
const TRAM_B = TRAM_PATH[TRAM_PATH.length - 1];
// Smooth Catmull-Rom curve through the waypoints; centripetal parameter
// avoids loops/cusps where the tram takes sharp turns.
const tramCurve = new THREE.CatmullRomCurve3(TRAM_PATH, false, 'centripetal', 0.5);

// Sea: large flat circular disc that sits underneath the land and shows
// through wherever the land has a hole (the Bosphorus).
const sea = new THREE.Mesh(
  new THREE.CircleGeometry(LAND_RADIUS + 80, 96),
  new THREE.MeshStandardMaterial({ color: 0x2f7bb5, roughness: 0.25, metalness: 0.2 })
);
sea.rotation.x = -Math.PI / 2;
sea.position.y = 0;
sea.receiveShadow = true;
scene.add(sea);

// Land: a large circular disc with the wavy Bosphorus cut out as a hole.
const landShape = new THREE.Shape();
landShape.absarc(0, 0, LAND_RADIUS, 0, Math.PI * 2, false);

// Bosphorus hole — traced clockwise (opposite to the outer circle) so it
// is recognised as a hole by the triangulator.
const bosphorusPath = new THREE.Path();
const STEPS = 90;
// Right (east) shore going south: from (cx+half, NORTH) down to (cx+half, SOUTH)
for (let i = STEPS; i >= 0; i--) {
  const t = i / STEPS;
  const y = STRAIT_SOUTH_Y + STRAIT_LEN * t;
  const cx = bosphorusCenterXAtT(t);
  const x = cx + STRAIT_HALF;
  if (i === STEPS) bosphorusPath.moveTo(x, y);
  else bosphorusPath.lineTo(x, y);
}
// South cap: arc east → west via south (-Y in shape). Clockwise: 0 → -π/2 → -π.
bosphorusPath.absarc(bosphorusCenterXAtT(0), STRAIT_SOUTH_Y, STRAIT_HALF, 0, -Math.PI, true);
// Left (west) shore going north: from (cx-half, SOUTH) up to (cx-half, NORTH)
for (let i = 0; i <= STEPS; i++) {
  const t = i / STEPS;
  const y = STRAIT_SOUTH_Y + STRAIT_LEN * t;
  const cx = bosphorusCenterXAtT(t);
  const x = cx - STRAIT_HALF;
  bosphorusPath.lineTo(x, y);
}
// North cap: arc west → east via north (+Y in shape). Clockwise: π → π/2 → 0.
bosphorusPath.absarc(bosphorusCenterXAtT(1), STRAIT_NORTH_Y, STRAIT_HALF, Math.PI, 0, true);

landShape.holes.push(bosphorusPath);

const landGeom = new THREE.ExtrudeGeometry(landShape, {
  depth: 3,
  bevelEnabled: false,
  curveSegments: 96
});
landGeom.rotateX(-Math.PI / 2); // shape +Y → world -Z (north); extrusion goes downward
const land = new THREE.Mesh(
  landGeom,
  new THREE.MeshStandardMaterial({ color: 0x9cc77a, roughness: 0.85 })
);
land.position.y = 2; // top surface at y=2 (above sea), base at y=-1 (below sea)
land.receiveShadow = true;
scene.add(land);

// ---------- generic buildings ----------
// Scatter buildings across the circular land in a jittered grid, skipping
// any cell that falls inside the Bosphorus or inside a landmark plaza.
const rng = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(42);
const palette = [COLORS.red, COLORS.blue, COLORS.yellow, COLORS.white, COLORS.orange, COLORS.pink, COLORS.teal, COLORS.cream, COLORS.tan];

function isOnLand(x, z) {
  return (x * x + z * z) < (LAND_RADIUS - 6) * (LAND_RADIUS - 6);
}
function isInBosphorus(x, z) {
  const cx = bosphorusCenterXAtZ(z);
  if (cx === null) return false;
  return Math.abs(x - cx) < STRAIT_HALF + 2.5;
}
// Distance from point (px, pz) to line segment (ax, az) → (bx, bz).
function distToSegment(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const lenSq = dx * dx + dz * dz;
  if (lenSq === 0) return Math.hypot(px - ax, pz - az);
  let t = ((px - ax) * dx + (pz - az) * dz) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
}
// Distance from point (px, pz) to a polyline given as an array of Vector3.
// Used to keep buildings off the winding tram track.
function distToPolyline(px, pz, points) {
  let best = Infinity;
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const d = distToSegment(px, pz, a.x, a.z, b.x, b.z);
    if (d < best) best = d;
  }
  return best;
}
// Plaza exclusion zones around the major landmarks (radius in world units)
const landmarkExclusions = [
  { x: -100, z:  -90, r: 22 },   // Hagia Sophia
  { x: -135, z:  -55, r: 14 },   // Galata Tower
  { x: KIZKULESI_X, z: KIZKULESI_Z, r: 16 },                                                    // Maiden's Tower
  { x: bosphorusCenterXAtT(BRIDGE_T),     z: -STRAIT_SOUTH_Y - STRAIT_LEN * BRIDGE_T,     r: 30 }, // Bridge approaches
  { x: -170, z:  -95, r: 32 },   // Valens Aqueduct (Bozdoğan Kemeri)
];
function nearLandmark(x, z) {
  for (const lm of landmarkExclusions) {
    const dx = x - lm.x, dz = z - lm.z;
    if (dx * dx + dz * dz < lm.r * lm.r) return true;
  }
  return false;
}

for (let x = -210; x <= 210; x += 24) {
  for (let z = -210; z <= 210; z += 24) {
    const jx = x + (rng() - 0.5) * 8;
    const jz = z + (rng() - 0.5) * 8;
    if (!isOnLand(jx, jz)) continue;
    if (isInBosphorus(jx, jz)) continue;
    if (nearLandmark(jx, jz)) continue;
    if (distToPolyline(jx, jz, TRAM_PATH) < 3.5) continue;
    // Sparser city: keep roughly 35% of grid cells.
    if (rng() < 0.65) continue;
    const w = (5 + rng() * 4) * BUILDING_SCALE, d = (5 + rng() * 4) * BUILDING_SCALE, h = (4 + rng() * 14) * BUILDING_SCALE;
    const c = palette[Math.floor(rng() * palette.length)];
    const b = block(w, h, d, c);
    addWindows(b, w, h, d);
    // roof variety
    const roofType = rng();
    if (roofType < 0.45) {
      addParapet(b, w, d, h, 0xd8d4cc);
    } else if (roofType < 0.8) {
      addPyramid(b, w, d, h, COLORS.roofred);
    } else {
      addParapet(b, w, d, h, 0xd8d4cc);
      // rooftop hut (water tank / utility room)
      const hutW = w * 0.3, hutD = d * 0.3;
      const hut = block(hutW, 1.2, hutD, COLORS.darkgray);
      hut.position.y = h + 0.3 + 0.6;
      b.add(hut);
      const hutRoof = new THREE.Mesh(
        new THREE.ConeGeometry(Math.hypot(hutW, hutD) * 0.5 + 0.1, 0.7, 4),
        new THREE.MeshStandardMaterial({ color: COLORS.roofred })
      );
      hutRoof.position.y = h + 0.3 + 1.2 + 0.35;
      hutRoof.rotation.y = Math.PI / 4;
      b.add(hutRoof);
    }
    // door
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 1.4, 0.06),
      new THREE.MeshStandardMaterial({ color: COLORS.door, roughness: 0.7 })
    );
    door.position.set(0, 0.7, d / 2 + 0.03);
    b.add(door);
    // occasional mid-height balcony on tall buildings
    if (h > 11 && rng() < 0.5) {
      const balcony = new THREE.Mesh(
        new THREE.BoxGeometry(w * 0.55, 0.15, 0.6),
        new THREE.MeshStandardMaterial({ color: 0xd0d0d0 })
      );
      balcony.position.set(0, h * 0.6, d / 2 + 0.3);
      b.add(balcony);
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(w * 0.55, 0.5, 0.05),
        new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
      );
      rail.position.set(0, h * 0.6 + 0.32, d / 2 + 0.6);
      b.add(rail);
    }
    // antenna on some roofs
    if (rng() < 0.25) {
      const ant = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 1.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x2c2c2c })
      );
      ant.position.y = h + 0.75;
      b.add(ant);
    }
    b.position.set(jx, 2, jz);
    b.rotation.y = (rng() - 0.5) * 0.3;
    scene.add(b);
  }
}

// ---------- Bosphorus Bridge — loaded from GLB ----------
// The source model's long axis runs along +X. We scale it so its long
// axis is ~58 units (spanning the curved strait with a little overhang)
// and rotate the parent group to align it perpendicular to the local
// channel direction at BRIDGE_T.
const bridgeGroup = new THREE.Group();
bridgeGroup.position.set(
  bosphorusCenterXAtT(BRIDGE_T),
  2,
  -STRAIT_SOUTH_Y - STRAIT_LEN * BRIDGE_T
);
bridgeGroup.rotation.y = bosphorusRotationAtT(BRIDGE_T) - Math.PI / 2;
scene.add(bridgeGroup);

{
  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    'assets/models/suspension-bridge.glb',
    (gltf) => {
      const model = gltf.scene;
      // 1) measure the unscaled model
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      // 2) uniform scale so the long axis crosses the strait
      const target = 58 * BUILDING_SCALE;
      const s = rawSize.x > 0 ? target / rawSize.x : 1;
      model.scale.setScalar(s);
      // 3) re-measure (scale + rotation included), then center horizontally
      //    and plant the base at local y=0
      const box = new THREE.Box3().setFromObject(model);
      model.position.x -= (box.min.x + box.max.x) / 2;
      model.position.z -= (box.min.z + box.max.z) / 2;
      model.position.y -= box.min.y;
      // 4) enable shadows on every mesh in the model
      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      bridgeGroup.add(model);
    },
    undefined,
    (err) => console.error('Failed to load bridge model:', err)
  );
}

// ---------- vapur ferries on the Bosphorus — loaded from GLB ----------
const boats = [];
{
  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    'assets/models/vapur.glb',
    (gltf) => {
      const template = gltf.scene;
      // 1) measure the unscaled model
      const rawBox = new THREE.Box3().setFromObject(template);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      // 2) pick a uniform scale so the longest axis is ~14 units before the
      //    global BUILDING_SCALE is applied, keeping the ferries in proportion
      //    with the city (the source model has its length along +X)
      const longest = Math.max(rawSize.x, rawSize.y, rawSize.z);
      const target = 14 * BUILDING_SCALE;
      const s = longest > 0 ? target / longest : 1;
      template.scale.setScalar(s);
      // 3) re-measure (the scale is now baked into the world-space box),
      //    then center horizontally and plant the base at local y=0
      const box = new THREE.Box3().setFromObject(template);
      template.position.x -= (box.min.x + box.max.x) / 2;
      template.position.z -= (box.min.z + box.max.z) / 2;
      template.position.y -= box.min.y;
      // 4) enable shadows on every mesh in the template (clones inherit)
      template.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      // 5) spawn two vapurs, each on its own lateral lane offset from the
      //    centerline so their routes never cross and they can't collide.
      //    STRAIT_HALF is 48 and the vapur is ~14 long, so ±12 keeps a
      //    safe gap between the two lanes while staying well clear of shore.
      const VAPUR_LANES = [
        { t: 0.30, speed: 0.00070, dir:  1, lane:  12 }, // north-bound, east lane
        { t: 0.80, speed: 0.00065, dir: -1, lane: -12 }, // south-bound, west lane
      ];
      for (const cfg of VAPUR_LANES) {
        const b = template.clone();
        b.userData = { t: cfg.t, speed: cfg.speed, dir: cfg.dir, lane: cfg.lane };
        boats.push(b);
        scene.add(b);
      }
    },
    undefined,
    (err) => console.error('Failed to load vapur model:', err)
  );
}

// ---------- tram & tramway ----------
// The track follows tramCurve (declared up top), winding from one end of
// the land to the other. We sample the curve at small intervals and lay
// short straight segments (bed + two rails + occasional sleepers) oriented
// along each sample's tangent.
const trackGroup = new THREE.Group();
{
  const TRACK_STEP   = 1.0;   // length of each straight segment along the curve
  const RAIL_GAUGE   = 1.55;  // half-distance between the two rails
  const BED_WIDTH    = 4.2;
  const BED_HEIGHT   = 0.8;
  const RAIL_HEIGHT  = 0.12;
  const RAIL_WIDTH   = 0.22;
  const SLEEPER_PITCH = 2.2;  // one sleeper roughly every 2.2 world units

  const totalLen = tramCurve.getLength();
  const segCount = Math.max(2, Math.ceil(totalLen / TRACK_STEP));
  // Tick off every Nth segment to place a sleeper so the spacing in world
  // units comes out close to SLEEPER_PITCH.
  const sleeperEvery = Math.max(1, Math.round(SLEEPER_PITCH / TRACK_STEP));

  const bedMat = new THREE.MeshStandardMaterial({ color: 0x3b3a36, roughness: 0.95 });
  const railMat = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.55, metalness: 0.55 });
  const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3623, roughness: 0.9 });

  for (let i = 0; i < segCount; i++) {
    const t0 = i / segCount;
    const t1 = (i + 1) / segCount;
    const p0 = tramCurve.getPoint(t0);
    const p1 = tramCurve.getPoint(t1);
    const len = p0.distanceTo(p1);
    if (len < 0.01) continue;
    const mid = p0.clone().add(p1).multiplyScalar(0.5);
    // Y-rotation so the local +X axis (the bed's long edge) lies along the
    // segment's world tangent. Three.js Y-rotation turns +X toward -Z for
    // positive angles, hence the negated z-component.
    const angle = Math.atan2(-(p1.z - p0.z), p1.x - p0.x);

    const seg = new THREE.Group();
    seg.position.set(mid.x, mid.y, mid.z);
    seg.rotation.y = angle;
    trackGroup.add(seg);

    const bed = new THREE.Mesh(
      new THREE.BoxGeometry(len + 0.02, BED_HEIGHT, BED_WIDTH),
      bedMat
    );
    bed.position.y = BED_HEIGHT / 2;
    bed.receiveShadow = true;
    seg.add(bed);

    for (const off of [-RAIL_GAUGE, RAIL_GAUGE]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(len + 0.02, RAIL_HEIGHT, RAIL_WIDTH),
        railMat
      );
      rail.position.set(0, BED_HEIGHT + RAIL_HEIGHT / 2, off);
      rail.castShadow = true;
      rail.receiveShadow = true;
      seg.add(rail);
    }

    if (i % sleeperEvery === 0) {
      const sleeper = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.08, BED_WIDTH + 0.2),
        sleeperMat
      );
      sleeper.position.set(0, BED_HEIGHT - 0.04, 0);
      sleeper.receiveShadow = true;
      seg.add(sleeper);
    }
  }
}
scene.add(trackGroup);

// Two small stop markers at the endpoints.
for (const stop of [TRAM_A, TRAM_B]) {
  const post = new THREE.Mesh(

}

// Tram vehicle — loaded from GLB and animated to shuttle along the track.
const tramGroup = new THREE.Group();
tramGroup.position.copy(TRAM_A);
// Initial facing matches the curve's tangent at the start, so the model
// doesn't pop into a new orientation the first frame after loading.
{
  const t0 = tramCurve.getTangent(0);
  tramGroup.rotation.y = Math.atan2(-t0.z, t0.x);
}
scene.add(tramGroup);

let tramReady = false;
{
  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    'assets/models/tramvay.glb',
    (gltf) => {
      const model = gltf.scene;
      // 1) measure the unscaled model
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      // 2) pick a uniform scale so the longest axis is ~14 scene units
      const longest = Math.max(rawSize.x, rawSize.y, rawSize.z);
      const target = 14;

      model.position.z -= (box.min.z + box.max.z) / 2;

      // 4) enable shadows

        }

      tramGroup.add(model);
      tramReady = true;
    },
    undefined,
    (err) => console.error('Failed to load tram model:', err)
  );
}

// Shuttle state: tramT runs 0 → 1 (A→B) then 1 → 0 (B→A) and repeats.
let tramT = 0;
let tramDirSign = 1; // +1 going A→B, -1 going B→A
const TRAM_SPEED = 0.0009; // fraction of track length per frame

// seagulls circling Kızkulesi with flapping wings
const gulls = new THREE.Group();
for (let i = 0; i < 6; i++) {
  const gull = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.2, 0.3),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  gull.add(body);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.45), wingMat);
  wingL.position.set(-0.6, 0.05, 0);
  gull.add(wingL);
  const wingR = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.45), wingMat);
  wingR.position.set(0.6, 0.05, 0);
  gull.add(wingR);
  gull.userData = { r: 8 + i * 2, a: i * 1.3, y: 18 + i * 1.5, s: 0.5 + rng() * 0.5, flap: rng() * Math.PI * 2 };
  gulls.add(gull);
}
gulls.position.set(KIZKULESI_X, 0, KIZKULESI_Z);
scene.add(gulls);

// ---------- animation loop ----------
function tick() {
  requestAnimationFrame(tick);
  for (const b of boats) {
    b.userData.t += b.userData.speed * b.userData.dir;
    if (b.userData.t > 1) b.userData.t -= 1;
    if (b.userData.t < 0) b.userData.t += 1;
    // Lane offset keeps each vapur on its own parallel route; the channel's
    // X-wiggle is small enough that a constant X shift reads as a separate lane.
    b.position.x = bosphorusCenterXAtT(b.userData.t) + (b.userData.lane || 0);
    b.position.z = -STRAIT_SOUTH_Y - STRAIT_LEN * b.userData.t;
    b.rotation.y = bosphorusRotationAtT(b.userData.t);
  }
  if (tramReady) {
    tramT += TRAM_SPEED * tramDirSign;
    if (tramT >= 1) { tramT = 1; tramDirSign = -1; }
    if (tramT <= 0) { tramT = 0; tramDirSign =  1; }
    const p = tramCurve.getPoint(tramT);
    const tan = tramCurve.getTangent(tramT);
    // Heading: face along the curve's tangent, flipped 180° when the tram
    // is travelling the reverse direction so the model never backs up.
    tramGroup.position.set(p.x, TRAM_A.y, p.z);
    tramGroup.rotation.y = Math.atan2(-tan.z, tan.x) + (tramDirSign < 0 ? Math.PI : 0);
  }
  for (const gull of gulls.children) {
    const u = gull.userData;
    u.a += 0.02 * u.s;
    u.flap += 0.18;
    gull.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(u.a * 3) * 0.8, Math.sin(u.a) * u.r);
    gull.rotation.y = -u.a;
    gull.children[1].rotation.z = Math.sin(u.flap) * 0.7;
    gull.children[2].rotation.z = -Math.sin(u.flap) * 0.7;
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
