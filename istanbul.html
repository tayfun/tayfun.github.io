<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Istanbul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #aee3f5; font-family: sans-serif; }
  #info { position: absolute; top: 12px; left: 12px; color: #234; background: rgba(255,255,255,.75);
          padding: 8px 12px; border-radius: 8px; font-size: 13px; user-select: none; }
</style>
</head>
<body>
<div id="info">🏙️ Istanbul — drag (or 2‑finger ↔) to orbit · scroll (or 2‑finger ↕) to zoom</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- scene basics ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaee3f5);
scene.fog = new THREE.Fog(0xaee3f5, 140, 450);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(70, 55, 90);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 25;
controls.maxDistance = 260;
controls.enableDamping = true;

// ---------- custom touch handling ----------
// OrbitControls already drives single-finger drag for rotation. For
// two-finger gestures we override the default so that:
//   - horizontal swipe → orbit (rotate)
//   - vertical swipe   → dolly (zoom in / zoom out)
//   - pinch (spread)   → zoom (same direction as the vertical dolly)
// We register on document with capture:true so these listeners fire
// BEFORE OrbitControls' target listeners on the canvas; calling
// stopPropagation then keeps OrbitControls from also handling the same
// gesture.
const dom = renderer.domElement;
const twoFinger = { active: false, mode: null, cx: 0, cy: 0, startDist: 0 };

// OrbitControls in three@0.160 does NOT expose rotateLeft / dollyIn /
// dollyOut / getDollyScale on `this` — they're closure-internal. We
// apply rotations and dolly directly to the camera position; the next
// controls.update() tick re-syncs from there. The math matches what
// OrbitControls does internally (rotate around camera.up, which is the
// default world (0,1,0) in this scene).
const _camOffset = new THREE.Vector3();
const _worldUp = new THREE.Vector3(0, 1, 0);

function rotateHorizontal(dx) {
  // Same magnitude formula OrbitControls uses for mouse-drag rotate.
  // The sign is flipped so applyAxisAngle produces the same direction
  // as OrbitControls' rotateLeft(positive) — clockwise around +Y.
  const angle = 2 * Math.PI * dx / dom.clientHeight;
  _camOffset.copy(camera.position).sub(controls.target);
  _camOffset.applyAxisAngle(_worldUp, -angle);
  camera.position.copy(controls.target).add(_camOffset);
}

function dollyBy(dy) {
  // dy > 0 (drag down) → zoom out
  // dy < 0 (drag up)   → zoom in
  const dollyDelta = (Math.abs(dy) / dom.clientHeight) * 20;
  const dollyScale = Math.pow(0.95, dollyDelta);
  _camOffset.copy(camera.position).sub(controls.target);
  if (dy > 0) _camOffset.multiplyScalar(1 / dollyScale);
  else        _camOffset.multiplyScalar(dollyScale);
  // Respect OrbitControls' min/max distance clamps
  const clamped = Math.max(controls.minDistance,
                  Math.min(controls.maxDistance, _camOffset.length()));
  _camOffset.setLength(clamped);
  camera.position.copy(controls.target).add(_camOffset);
}

function pinchBy(curDist, startDist) {
  const scale = curDist / startDist;
  _camOffset.copy(camera.position).sub(controls.target);
  _camOffset.multiplyScalar(1 / scale);
  const clamped = Math.max(controls.minDistance,
                  Math.min(controls.maxDistance, _camOffset.length()));
  _camOffset.setLength(clamped);
  camera.position.copy(controls.target).add(_camOffset);
}

function tsStart(e) {
  if (e.target !== dom || e.touches.length !== 2) return;
  e.preventDefault();
  e.stopPropagation();
  const t0 = e.touches[0], t1 = e.touches[1];
  twoFinger.active = true;
  twoFinger.mode = null;
  twoFinger.startDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  twoFinger.cx = (t0.clientX + t1.clientX) / 2;
  twoFinger.cy = (t0.clientY + t1.clientY) / 2;
}

function tsMove(e) {
  if (!twoFinger.active || e.touches.length !== 2) return;
  e.preventDefault();
  e.stopPropagation();
  const t0 = e.touches[0], t1 = e.touches[1];
  const cx = (t0.clientX + t1.clientX) / 2;
  const cy = (t0.clientY + t1.clientY) / 2;
  const curDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  const dx = cx - twoFinger.cx;
  const dy = cy - twoFinger.cy;

  // Lock the gesture to its dominant flavour on the first move
  if (twoFinger.mode === null) {
    const distChange = Math.abs(curDist - twoFinger.startDist);
    if (distChange > 10)            twoFinger.mode = 'pinch';
    else if (Math.abs(dx) > Math.abs(dy)) twoFinger.mode = 'rotate';
    else                             twoFinger.mode = 'dolly';
  }

  if (twoFinger.mode === 'rotate') {
    rotateHorizontal(dx);
  } else if (twoFinger.mode === 'dolly') {
    dollyBy(dy);
  } else { // pinch
    pinchBy(curDist, twoFinger.startDist);
    twoFinger.startDist = curDist; // incremental so each move scales from the last
  }

  twoFinger.cx = cx;
  twoFinger.cy = cy;
}

function tsEnd(e) {
  if (twoFinger.active && e.touches.length < 2) {
    twoFinger.active = false;
    twoFinger.mode = null;
  }
}

document.addEventListener('touchstart',  tsStart, { passive: false, capture: true });
document.addEventListener('touchmove',   tsMove,  { passive: false, capture: true });
document.addEventListener('touchend',    tsEnd,   { capture: true });
document.addEventListener('touchcancel', tsEnd,   { capture: true });

// ---------- horizontal trackpad / wheel handling ----------
// On a trackpad (or Magic Mouse), a two-finger horizontal swipe arrives
// as a `wheel` event with a non-zero deltaX — not as touch events.
// Firefox and some Linux setups instead send horizontal motion as
// vertical wheel + Shift. We catch both, while leaving vertical wheel
// and pinch (ctrl+wheel) zoom for OrbitControls to handle.
//
// Registered on `document` with `capture:true` so we run BEFORE
// OrbitControls' own canvas wheel listener; `stopPropagation` then
// stops the gesture from being doubled as a zoom.
document.addEventListener('wheel', (e) => {
  // Pinch on macOS trackpad: ctrlKey + deltaY. Pass through to OrbitControls.
  if (e.ctrlKey) return;

  // Horizontal-dominant wheel (macOS / Windows / Magic Mouse trackpads)
  if (e.deltaX !== 0 && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    e.preventDefault();
    e.stopPropagation();
    rotateHorizontal(e.deltaX);
    return;
  }

  // Shift+vertical wheel (Firefox / some Linux setups treat this as horizontal)
  if (e.shiftKey && e.deltaX === 0 && e.deltaY !== 0) {
    e.preventDefault();
    e.stopPropagation();
    rotateHorizontal(e.deltaY);
    return;
  }

  // Anything else (plain vertical wheel / pinch handled above) — let
  // OrbitControls deal with it as a zoom.
}, { passive: false, capture: true });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff3d6, 1.5);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -130; sun.shadow.camera.right = 130;
sun.shadow.camera.top = 130; sun.shadow.camera.bottom = -130;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc4d8ff, 0.35);
fill.position.set(-50, 30, -40);
scene.add(fill);

// ---------- palette ----------
const COLORS = {
  red: 0xc4281c, blue: 0x0d69ab, yellow: 0xf2cd37, green: 0x237841,
  white: 0xf4f4f4, cream: 0xeedfb5, tan: 0xe4cd9e, gray: 0x9ba19d,
  darkgray: 0x6c6e68, darkred: 0x8a2a1e, brown: 0x7b5d41,
  orange: 0xfe8a18, pink: 0xfc97ac, teal: 0x008f9b, gold: 0xc5a224,
  domered: 0xa44a3c, stone: 0xc9b58a, window: 0x7fb6d9,
  roofred: 0x8a2a1e, darkwood: 0x4a3623, grass: 0x2f8a4e,
  door: 0x3a2a1c
};

// ---------- helpers ----------
// A solid block — base at group y=0, top at y=h. No studs.
function block(w, h, d, color, opts = {}) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.roughness ?? 0.75, metalness: opts.metalness ?? 0.04
  });
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  box.position.y = h / 2;
  box.castShadow = box.receiveShadow = true;
  g.add(box);
  g.userData.mat = mat;
  return g;
}

// Window grid applied to a box at group origin (base y=0, top y=h)
function addWindows(g, w, h, d, color = COLORS.window, floors = null) {
  const winW = 0.55, winH = 0.75, winD = 0.05;
  const winMat = new THREE.MeshStandardMaterial({
    color, roughness: 0.25, metalness: 0.4,
    emissive: color, emissiveIntensity: 0.25
  });
  const fl = floors ?? Math.max(1, Math.floor((h - 1) / 1.5));
  const yStart = 1.0;
  const usable = Math.max(0.5, h - yStart - 0.4);
  const step = usable / fl;
  const colsX = Math.max(1, Math.round(w / 1.3));
  const colsZ = Math.max(1, Math.round(d / 1.3));
  for (let r = 0; r < fl; r++) {
    const y = yStart + r * step + step / 2;
    for (let i = 0; i < colsX; i++) {
      const x = -w / 2 + (i + 0.5) * (w / colsX);
      for (const sign of [-1, 1]) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(winW, winH, winD), winMat);
        win.position.set(x, y, sign * (d / 2 + 0.02));
        g.add(win);
      }
    }
    for (let i = 0; i < colsZ; i++) {
      const z = -d / 2 + (i + 0.5) * (d / colsZ);
      for (const sign of [-1, 1]) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(winD, winH, winW), winMat);
        win.position.set(sign * (w / 2 + 0.02), y, z);
        g.add(win);
      }
    }
  }
}

// Small pyramidal roof on top of a block whose top is at baseY
function addPyramid(g, w, d, baseY, color, height = null) {
  const roofH = height ?? Math.min(2.5, Math.min(w, d) * 0.65);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(Math.hypot(w, d) * 0.5 + 0.2, roofH, 4),
    new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
  );
  roof.position.y = baseY + roofH / 2;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
}

// Flat parapet raised on the edge of a block whose top is at baseY
function addParapet(g, w, d, baseY, color, thickness = 0.3) {
  const par = new THREE.Mesh(
    new THREE.BoxGeometry(w + thickness * 2, thickness, d + thickness * 2),
    new THREE.MeshStandardMaterial({ color, roughness: 0.8 })
  );
  par.position.y = baseY + thickness / 2;
  par.castShadow = true;
  g.add(par);
}

// A traditional minaret: tapered shaft + bands + balcony + cap + finial.
// The returned group has its shaft base at local y=0; caller positions the group.
function minaret(x, z, h, color = COLORS.cream) {
  const g = new THREE.Group();
  const bandMat = new THREE.MeshStandardMaterial({ color: COLORS.gold, metalness: 0.55, roughness: 0.4 });
  // tapered shaft
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.85, 1.0, h, 16),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7 })
  );
  shaft.position.y = h / 2;
  shaft.castShadow = true;
  g.add(shaft);
  // decorative bands
  for (const yBand of [h * 0.28, h * 0.55]) {
    const ring = new THREE.Mesh(
      new THREE.CylinderGeometry(1.06, 1.06, 0.18, 16),
      bandMat
    );
    ring.position.y = yBand;
    g.add(ring);
  }
  // balcony platform
  const balc = new THREE.Mesh(
    new THREE.CylinderGeometry(1.45, 1.45, 0.3, 16),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7 })
  );
  balc.position.y = h * 0.74;
  balc.castShadow = true;
  g.add(balc);
  // balcony railing
  const rail = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.5, 0.6, 16, 1, true),
    new THREE.MeshStandardMaterial({ color: COLORS.darkgray, side: THREE.DoubleSide })
  );
  rail.position.y = h * 0.74 + 0.45;
  g.add(rail);
  // conical cap
  const cap = new THREE.Mesh(
    new THREE.ConeGeometry(1.15, 2.2, 12),
    bandMat
  );
  cap.position.y = h + 1.1;
  cap.castShadow = true;
  g.add(cap);
  // finial spike + ball
  const spike = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.6, 6), bandMat);
  spike.position.y = h + 2.9;
  g.add(spike);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), bandMat);
  orb.position.y = h + 3.85;
  g.add(orb);
  g.position.set(x, 0, z);
  return g;
}

// A hemispherical dome with base ring and gold finial. Sits at local y = baseY.
function dome(radius, color, baseY, height = null) {
  const g = new THREE.Group();
  const h = height ?? radius * 0.7;
  const d = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 24, 14, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color, roughness: 0.55 })
  );
  d.position.y = baseY;
  d.castShadow = true;
  g.add(d);
  // base ring (drum)
  const ring = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 1.04, radius * 1.04, 0.35, 24),
    new THREE.MeshStandardMaterial({ color: COLORS.cream, roughness: 0.7 })
  );
  ring.position.y = baseY - 0.18;
  g.add(ring);
  // gold finial: stem + orb + spike
  const finialMat = new THREE.MeshStandardMaterial({ color: COLORS.gold, metalness: 0.65, roughness: 0.35 });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 0.8, 8), finialMat);
  stem.position.y = baseY + h + 0.4;
  g.add(stem);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), finialMat);
  orb.position.y = baseY + h + 0.95;
  g.add(orb);
  const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.6, 6), finialMat);
  spike.position.y = baseY + h + 1.4;
  g.add(spike);
  return g;
}

// A conifer-style tree planted at world (x, z), sitting on ground at y=2.
function tree(x, z, scale = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25 * scale, 0.35 * scale, 1.5 * scale, 8),
    new THREE.MeshStandardMaterial({ color: COLORS.darkwood, roughness: 0.9 })
  );
  trunk.position.y = 0.75 * scale;
  trunk.castShadow = true;
  g.add(trunk);
  const fol1 = new THREE.Mesh(
    new THREE.ConeGeometry(1.4 * scale, 2.4 * scale, 8),
    new THREE.MeshStandardMaterial({ color: COLORS.green, roughness: 0.8 })
  );
  fol1.position.y = 1.8 * scale;
  fol1.castShadow = true;
  g.add(fol1);
  const fol2 = new THREE.Mesh(
    new THREE.ConeGeometry(1.0 * scale, 1.8 * scale, 8),
    new THREE.MeshStandardMaterial({ color: COLORS.grass, roughness: 0.8 })
  );
  fol2.position.y = 2.95 * scale;
  fol2.castShadow = true;
  g.add(fol2);
  g.position.set(x, 2, z);
  return g;
}

// ---------- ground & sea ----------
const SEA_Z_HALF = 18;
const sea = new THREE.Mesh(
  new THREE.BoxGeometry(320, 2, SEA_Z_HALF * 2),
  new THREE.MeshStandardMaterial({ color: 0x2f7bb5, roughness: 0.25, metalness: 0.2 })
);
sea.position.y = -1;
sea.receiveShadow = true;
scene.add(sea);

function land(zCenter, depth, color) {
  const l = block(320, 2, depth, color);
  l.position.set(0, 0, zCenter);
  scene.add(l);
}
land(-SEA_Z_HALF - 22, 44, 0x8fbd6b); // European side
land( SEA_Z_HALF + 22, 44, 0x9cc77a); // Asian side

// roads + lane dashes + sidewalks
for (const z of [-SEA_Z_HALF - 6, SEA_Z_HALF + 6]) {
  const road = new THREE.Mesh(
    new THREE.BoxGeometry(320, 0.15, 6),
    new THREE.MeshStandardMaterial({ color: 0x58595b })
  );
  road.position.set(0, 2.1, z);
  road.receiveShadow = true;
  scene.add(road);
  for (let x = -150; x <= 150; x += 6) {
    const dash = new THREE.Mesh(
      new THREE.BoxGeometry(3, 0.17, 0.18),
      new THREE.MeshStandardMaterial({ color: 0xfff5b0 })
    );
    dash.position.set(x, 2.2, z);
    scene.add(dash);
  }
  for (const sOff of [-3.5, 3.5]) {
    const sidewalk = new THREE.Mesh(
      new THREE.BoxGeometry(320, 0.2, 1.6),
      new THREE.MeshStandardMaterial({ color: 0xb8b8b8 })
    );
    sidewalk.position.set(0, 2.2, z + sOff);
    scene.add(sidewalk);
  }
}

// ---------- generic buildings ----------
const rng = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(42);
const palette = [COLORS.red, COLORS.blue, COLORS.yellow, COLORS.white, COLORS.orange, COLORS.pink, COLORS.teal, COLORS.cream, COLORS.tan];

function buildings(zCenter, sign) {
  for (let x = -130; x <= 130; x += 11) {
    // landmark exclusions
    if (Math.abs(x) < 34 && zCenter < 0) continue;   // Hagia Sophia plaza
    if (x > 40 && x < 62 && zCenter > 0) continue;    // Maiden's Tower water spot
    if (x < -55 && x > -70 && zCenter < 0) continue;  // Galata spot
    const w = 5 + rng() * 4, d = 5 + rng() * 4, h = 4 + rng() * 14;
    const roll = rng();
    if (roll < 0.1) {
      // small mosque-like building with dome + minaret
      const b = block(w, h, d, COLORS.cream);
      addWindows(b, w, h, d, COLORS.window, 2);
      // small dome on top
      const dr = Math.min(w, d) * 0.45;
      const dTop = dome(dr, COLORS.gray, h);
      b.add(dTop);
      // drum
      // corner minaret
      b.add(minaret(w / 2 + 0.6, d / 2 + 0.6, h + 4, COLORS.cream));
      // door
      const door = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 1.5, 0.06),
        new THREE.MeshStandardMaterial({ color: COLORS.door, roughness: 0.7 })
      );
      door.position.set(0, 0.75, d / 2 + 0.03);
      b.add(door);
      b.position.set(x + (rng() - 0.5) * 2, 2, zCenter + sign * (10 + rng() * 12));
      b.rotation.y = (rng() - 0.5) * 0.3;
      scene.add(b);
      continue;
    }
    const c = palette[Math.floor(rng() * palette.length)];
    const b = block(w, h, d, c);
    addWindows(b, w, h, d);
    // roof variety
    const roofType = rng();
    if (roofType < 0.45) {
      addParapet(b, w, d, h, 0xd8d4cc);
    } else if (roofType < 0.8) {
      addPyramid(b, w, d, h, COLORS.roofred);
    } else {
      addParapet(b, w, d, h, 0xd8d4cc);
      // rooftop hut (water tank / utility room)
      const hutW = w * 0.3, hutD = d * 0.3;
      const hut = block(hutW, 1.2, hutD, COLORS.darkgray);
      hut.position.y = h + 0.3 + 0.6;
      b.add(hut);
      const hutRoof = new THREE.Mesh(
        new THREE.ConeGeometry(Math.hypot(hutW, hutD) * 0.5 + 0.1, 0.7, 4),
        new THREE.MeshStandardMaterial({ color: COLORS.roofred })
      );
      hutRoof.position.y = h + 0.3 + 1.2 + 0.35;
      hutRoof.rotation.y = Math.PI / 4;
      b.add(hutRoof);
    }
    // door
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 1.4, 0.06),
      new THREE.MeshStandardMaterial({ color: COLORS.door, roughness: 0.7 })
    );
    door.position.set(0, 0.7, d / 2 + 0.03);
    b.add(door);
    // occasional mid-height balcony on tall buildings
    if (h > 11 && rng() < 0.5) {
      const balcony = new THREE.Mesh(
        new THREE.BoxGeometry(w * 0.55, 0.15, 0.6),
        new THREE.MeshStandardMaterial({ color: 0xd0d0d0 })
      );
      balcony.position.set(0, h * 0.6, d / 2 + 0.3);
      b.add(balcony);
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(w * 0.55, 0.5, 0.05),
        new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
      );
      rail.position.set(0, h * 0.6 + 0.32, d / 2 + 0.6);
      b.add(rail);
    }
    // antenna on some roofs
    if (rng() < 0.25) {
      const ant = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 1.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x2c2c2c })
      );
      ant.position.y = h + 0.75;
      b.add(ant);
    }
    b.position.set(x + (rng() - 0.5) * 2, 2, zCenter + sign * (10 + rng() * 12));
    b.rotation.y = (rng() - 0.5) * 0.3;
    scene.add(b);
  }
}
buildings(-SEA_Z_HALF - 22, -1);
buildings( SEA_Z_HALF + 22,  1);

// ---------- trees on land (avoiding roads & landmarks) ----------
for (let i = 0; i < 60; i++) {
  const side = rng() < 0.5 ? -1 : 1;
  const x = (rng() - 0.5) * 300;
  // pick a z somewhere on the land (avoid the road strip)
  let z;
  const lane = rng();
  if (lane < 0.5) {
    // water-side strip
    z = side * (SEA_Z_HALF + 1.2 + rng() * 3.5);
  } else {
    // behind/inland area (but stay on land)
    z = side * (SEA_Z_HALF + 9 + rng() * 28);
  }
  // landmark exclusions
  if (Math.abs(x) < 34 && z < 0) continue;
  if (x > 40 && x < 62 && z > 0) continue;
  if (x < -55 && x > -70 && z < 0) continue;
  scene.add(tree(x, z, 0.7 + rng() * 0.5));
}

// ---------- Bosphorus Bridge — loaded from GLB ----------
// The source model's long axis runs along +X (length 1.0, height 0.487,
// width 0.215). In this scene the Bosphorus runs along Z and the strait
// is crossed in the Z direction, so we rotate the model 90° around Y
// so its length spans the water, scale the long axis to ~52 units, and
// plant the base at the level of the surrounding roads.
const bridgeGroup = new THREE.Group();
bridgeGroup.position.set(0, 2, 0);
scene.add(bridgeGroup);

{
  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    'assets/models/suspension-bridge.glb',
    (gltf) => {
      const model = gltf.scene;
      // 1) measure the unscaled model
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      // 2) uniform scale so the long axis (~52 scene units) crosses the strait
      const target = 52;
      const s = rawSize.x > 0 ? target / rawSize.x : 1;
      model.scale.setScalar(s);
      // 3) rotate so the long axis runs along +Z (crossing the Bosphorus)
      model.rotation.y = -Math.PI / 2;
      // 4) re-measure (scale + rotation included), then center horizontally
      //    and plant the base at local y=0
      const box = new THREE.Box3().setFromObject(model);
      model.position.x -= (box.min.x + box.max.x) / 2;
      model.position.z -= (box.min.z + box.max.z) / 2;
      model.position.y -= box.min.y;
      // 5) enable shadows on every mesh in the model
      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      bridgeGroup.add(model);
    },
    undefined,
    (err) => console.error('Failed to load bridge model:', err)
  );
}

// ---------- vapur ferries on the Bosphorus — loaded from GLB ----------
const boats = [];
{
  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    'assets/models/vapur.glb',
    (gltf) => {
      const template = gltf.scene;
      // 1) measure the unscaled model
      const rawBox = new THREE.Box3().setFromObject(template);
      const rawSize = rawBox.getSize(new THREE.Vector3());
      // 2) pick a uniform scale so the longest axis is ~14 scene units
      //    (the source model is assumed to have its length along +X)
      const longest = Math.max(rawSize.x, rawSize.y, rawSize.z);
      const target = 14;
      const s = longest > 0 ? target / longest : 1;
      template.scale.setScalar(s);
      // 3) re-measure (the scale is now baked into the world-space box),
      //    then center horizontally and plant the base at local y=0
      const box = new THREE.Box3().setFromObject(template);
      template.position.x -= (box.min.x + box.max.x) / 2;
      template.position.z -= (box.min.z + box.max.z) / 2;
      template.position.y -= box.min.y;
      // 4) enable shadows on every mesh in the template (clones inherit)
      template.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      // 5) spawn four vapurs spread along the strait, alternating sides
      for (let i = 0; i < 4; i++) {
        const b = template.clone();
        b.position.set(-100 + i * 60, 5, (i % 2 ? -1 : 1) * 8);
        b.userData = { speed: 0.06 + i * 0.02, dir: i % 2 ? 1 : -1 };
        boats.push(b);
        scene.add(b);
      }
    },
    undefined,
    (err) => console.error('Failed to load vapur model:', err)
  );
}

// seagulls circling Kızkulesi with flapping wings
const gulls = new THREE.Group();
for (let i = 0; i < 6; i++) {
  const gull = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.2, 0.3),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  gull.add(body);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.45), wingMat);
  wingL.position.set(-0.6, 0.05, 0);
  gull.add(wingL);
  const wingR = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.45), wingMat);
  wingR.position.set(0.6, 0.05, 0);
  gull.add(wingR);
  gull.userData = { r: 8 + i * 2, a: i * 1.3, y: 18 + i * 1.5, s: 0.5 + rng() * 0.5, flap: rng() * Math.PI * 2 };
  gulls.add(gull);
}
gulls.position.set(45, 0, 8);
scene.add(gulls);

// ---------- animation loop ----------
function tick() {
  requestAnimationFrame(tick);
  for (const b of boats) {
    b.position.x += b.userData.speed * b.userData.dir;
    if (b.position.x > 140) b.position.x = -140;
    if (b.position.x < -140) b.position.x = 140;
  }
  for (const gull of gulls.children) {
    const u = gull.userData;
    u.a += 0.02 * u.s;
    u.flap += 0.18;
    gull.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(u.a * 3) * 0.8, Math.sin(u.a) * u.r);
    gull.rotation.y = -u.a;
    gull.children[1].rotation.z = Math.sin(u.flap) * 0.7;
    gull.children[2].rotation.z = -Math.sin(u.flap) * 0.7;
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
