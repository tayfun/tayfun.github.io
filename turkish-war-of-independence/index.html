<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A three.js animation on a 3D relief map of Anatolia that follows the Turkish War of Independence, 1918–1923. English and Turkish, with narration.">
<title>Turkish War of Independence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one full-bleed 3D relief map on a table. Masthead top-left, running date top-right,
   narrative card bottom-left, chapter rail along the bottom edge. Single dark look by choice. */
:root{
  --ink:#0b1016; --ink-2:#131b24; --panel:rgba(10,15,21,.84);
  --paper:#efe7d6; --body:#d8d1c0; --muted:#a39f8f; --hair:rgba(239,231,214,.16);
  --red:#e4352b; --red-soft:#ff8f84; --gold:#e9bd62; --blue:#6aa3e6;
  --z-br:#a678c6; --z-fr:#3fb3a7; --z-it:#79b565;
  --f-display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --f-label:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --gut-l:max(22px,env(safe-area-inset-left,0px)); --gut-r:max(22px,env(safe-area-inset-right,0px));
  --rail-h:86px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;background:var(--ink);user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.shade{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(11,16,22,.72) 0,rgba(11,16,22,0) 17%),
    linear-gradient(0deg,rgba(11,16,22,.98) 0,rgba(11,16,22,.86) 9%,rgba(11,16,22,0) 24%),
    radial-gradient(120% 90% at 50% 45%,rgba(11,16,22,0) 55%,rgba(11,16,22,.55) 100%)}

/* labels pinned to the map */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;visibility:hidden;will-change:transform,opacity}
.lb.city{font:500 12px/1 var(--f-label);letter-spacing:.16em;color:var(--paper);
  text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 7px rgba(0,0,0,.9),0 0 2px #000}
.lb.city.major{font-size:14px;font-weight:600;letter-spacing:.2em}
.lb.ev{padding:6px 11px 7px;background:var(--panel);border:1px solid var(--hair);text-align:center}
.lb.ev b{display:block;font:600 14px/1.1 var(--f-label);letter-spacing:.14em;color:var(--paper)}
.lb.ev span{display:block;margin-top:3px;font:italic 400 12.5px/1.15 var(--f-body);color:var(--muted)}
.lb.ev em{display:block;margin-top:4px;font:600 12px/1 var(--f-label);letter-spacing:.2em;font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums}
.lb.ev::before{content:"";position:absolute;left:50%;top:-1px;width:26px;height:2px;margin-left:-13px;background:var(--gold)}
.lb.ev::after{content:"";position:absolute;left:var(--sx,50%);top:100%;width:1px;height:var(--stem,30px);background:linear-gradient(rgba(239,231,214,.85),rgba(239,231,214,.1))}
.lb.ev.battle::before{background:var(--red)} .lb.ev.battle b{color:var(--red-soft)}
.lb.ev.foe::before{background:var(--blue)} .lb.ev.foe b{color:var(--blue)}
.lb.ev.treaty::before{background:var(--paper)}
.lb.zone{text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.85)}
.lb.zone b{display:block;font:600 13px/1 var(--f-label);letter-spacing:.3em;color:#fff}
.lb.zone b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--c,#fff);transform:translateY(-1px) rotate(45deg)}
.lb.zone span{display:block;margin-top:4px;font:italic 400 12px/1 var(--f-body);color:var(--paper)}
.lb.ban{left:50%;top:70px;transform:translateX(-50%);pointer-events:none;text-align:center;padding:18px 90px 22px;background:radial-gradient(closest-side,rgba(11,16,22,.9),rgba(11,16,22,.72) 55%,rgba(11,16,22,0));text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.lb.ban b{display:block;font:600 clamp(20px,3vw,40px)/1 var(--f-display);letter-spacing:.14em;color:var(--paper)}
.lb.ban span{display:block;margin-top:8px;font:600 clamp(11px,1.1vw,15px)/1 var(--f-label);letter-spacing:.42em;color:var(--gold)}

/* masthead + date */
.mast{position:absolute;left:0;top:0;padding:20px var(--gut-r) 0 var(--gut-l);pointer-events:none}
.mast .k{font:600 12px/1 var(--f-label);letter-spacing:.34em;color:var(--red-soft)}
.mast h1{margin:8px 0 0;font:600 clamp(17px,1.9vw,25px)/1.1 var(--f-display);letter-spacing:.02em;color:var(--paper)}
.clock{position:absolute;right:0;top:0;padding:16px var(--gut-r) 34px 90px;text-align:right;pointer-events:none;background:radial-gradient(130% 120% at 100% 0,rgba(11,16,22,.92) 0,rgba(11,16,22,.7) 45%,rgba(11,16,22,0) 72%)}
.clock .t{font:500 11px/1 var(--f-label);letter-spacing:.34em;color:var(--muted)}
.clock .d{margin-top:6px;font:600 clamp(26px,3.4vw,46px)/1 var(--f-label);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--paper)}
.clock .d i{font-style:normal;color:var(--gold)}
.clock .aux{margin-top:10px;display:flex;justify-content:flex-end;align-items:center;gap:12px;font:500 11px/1 var(--f-label);letter-spacing:.24em;color:var(--muted)}
.clock .aux svg{width:38px;height:38px;display:block}
.clock .aux span{animation:hintOut 1.2s ease 16s forwards}
@keyframes hintOut{to{opacity:0}}

.cred{position:absolute;right:var(--gut-r);top:150px;font:400 10.5px/1 var(--f-label);letter-spacing:.1em;color:var(--muted);opacity:.7;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.9)}
/* legend: one row above the rail, changes with the chapter */
.legend{position:absolute;right:var(--gut-r);left:calc(var(--gut-l) + 430px);bottom:calc(var(--rail-h) + 12px);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 20px;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 var(--f-label);letter-spacing:.09em;color:var(--body);text-shadow:0 1px 3px rgba(0,0,0,.9)}
.legend svg{display:block;width:28px;height:12px;flex:none}
.legend .sw{width:22px;height:11px;flex:none;border:1px solid var(--c);background:repeating-linear-gradient(135deg,var(--c) 0 2.5px,rgba(0,0,0,.25) 2.5px 5px)}
.legend .sw.solid{background:var(--c)}

/* legend */

/* narrative card */
.card{position:absolute;left:var(--gut-l);bottom:calc(var(--rail-h) + 16px);width:min(410px,calc(100% - var(--gut-l) - var(--gut-r)));
  box-sizing:border-box;padding:18px 22px 20px;background:var(--panel);border:1px solid var(--hair);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card .no{display:flex;justify-content:space-between;gap:12px;font:500 11.5px/1 var(--f-label);letter-spacing:.3em;color:var(--muted)}
.card .date{margin-top:12px;font:600 15px/1.1 var(--f-label);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.card h2{margin:7px 0 10px;font:600 clamp(23px,2.5vw,33px)/1.08 var(--f-display);text-wrap:balance;color:var(--paper)}
.card p{margin:0;font:400 14.5px/1.5 var(--f-body);color:var(--body)}
.card blockquote{margin:13px 0 0;padding:0 0 0 14px;border-left:1px solid var(--gold);font:italic 400 15px/1.42 var(--f-body);color:var(--paper)}
.card cite{display:block;margin-top:6px;font:500 11px/1.2 var(--f-label);letter-spacing:.2em;font-style:normal;text-transform:uppercase;color:var(--muted)}
.card .in{animation:cardIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* chapter rail */
.rail{position:absolute;left:0;right:0;bottom:0;height:var(--rail-h);box-sizing:border-box;
  padding:0 var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;align-items:flex-end;gap:18px}
.ctl{display:flex;gap:6px;align-items:center;padding-bottom:13px}
.ctl button{width:38px;height:38px;display:grid;place-items:center;padding:0;border:1px solid var(--hair);background:rgba(10,15,21,.7);color:var(--paper);cursor:pointer}
.ctl button.play{width:46px;height:46px;border-color:var(--gold);color:var(--gold)}
.ctl button.snd{margin-left:8px}
.ctl button.snd.invite{border-color:var(--gold);color:var(--gold);animation:invite 2.2s ease-in-out infinite}
.ctl button.snd.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
@keyframes invite{0%,100%{box-shadow:0 0 0 0 rgba(233,189,98,.55)}60%{box-shadow:0 0 0 9px rgba(233,189,98,0)}}
.ctl .lang{display:flex}
.ctl .lang button{width:32px;font:600 12.5px/1 var(--f-label);letter-spacing:.1em}
.ctl .lang button+button{border-left:0}
.ctl .lang button.on{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.ctl button:hover{background:rgba(239,231,214,.12)}
.ctl svg{width:16px;height:16px;fill:currentColor}
.segs{flex:1;min-width:0;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;align-items:end}
.seg{position:relative;display:block;min-width:0;padding:22px 0 0;border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;font:500 12.5px/1 var(--f-label);letter-spacing:.08em}
.seg .yr{position:absolute;left:0;top:2px;font:600 12px/1 var(--f-label);letter-spacing:.2em;color:var(--paper);opacity:.75}
.seg .bar{display:block;height:4px;background:rgba(239,231,214,.2);overflow:hidden}
.seg .bar i{display:block;height:100%;width:0;background:var(--gold)}
.seg .nm{display:block;margin-top:8px;height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg:hover{color:var(--paper)} .seg.on{color:var(--paper)} .seg.on .bar i{background:var(--red)}
.seg.done .bar i{width:100%}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);color:var(--muted);font:500 13px/1.4 var(--f-label);letter-spacing:.34em;text-align:center;transition:opacity .6s}
#load.off{opacity:0;pointer-events:none}

@media (max-width:820px){
  :root{--rail-h:98px;--gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px))}
  .legend{display:none}
  .mast{padding-top:14px} .mast .k{font-size:10px} .mast h1{font-size:14px;max-width:10em}
  .clock .aux{display:none} .cred{display:none} .lb.ban{top:92px;padding:12px 30px 16px;width:max-content;max-width:92vw}
  .clock{padding-top:12px} .clock .t{font-size:9.5px} .clock .d{font-size:23px}
  .card{bottom:calc(var(--rail-h) + 8px);padding:13px 15px 14px}
  .card .date{margin-top:9px;font-size:13px} .card h2{font-size:21px;margin:5px 0 7px}
  .card p{font-size:13.5px;line-height:1.44} .card blockquote{display:none}
  .rail{flex-direction:column;align-items:stretch;gap:8px} .ctl{padding-bottom:0;justify-content:center} .ctl button{width:36px;height:36px} .ctl button.play{width:42px;height:42px}
  .segs{gap:3px;padding-bottom:6px;flex:none} .seg{padding-top:0} .seg .yr,.seg .nm{display:none} .seg .bar{height:5px}
  .lb.ev b{font-size:12px} .lb.ev span{font-size:11.5px} .lb.city{font-size:10.5px} .lb.city.major{font-size:12px}
}
@media (max-width:1080px){.legend{display:none}}
@media (prefers-reduced-motion:reduce){.card .in{animation:none}.ctl button.snd.invite{animation:none}}
</style>

</head>

  <canvas id="gl" aria-label="Animated 3D relief map of Anatolia, 1918 to 1923"></canvas>
  <div class="shade"></div>
  <div id="labels"></div>

  <header class="mast">
    <div class="k" id="hK">KURTULUŞ SAVAŞI · 1919 – 1923</div>
    <h1 id="hT">The Turkish War of Independence</h1>
  </header>

  <div class="clock" aria-live="off">
    <div class="t" id="hD">DATE ON THE MAP</div>

    <div class="aux"><span id="hH">DRAG TO ORBIT · SCROLL TO ZOOM</span><svg viewBox="0 0 40 40" aria-label="North"><circle cx="20" cy="20" r="18.5" fill="rgba(10,15,21,.6)" stroke="rgba(239,231,214,.3)"/><g id="north"><path d="M20 4.5l4.6 15.5h-9.2z" fill="#e4352b"/><path d="M20 35.5l4.6-15.5h-9.2z" fill="rgba(239,231,214,.55)"/><text x="20" y="13.5" text-anchor="middle" font-size="0" fill="#fff">N</text></g><text x="20" y="23.4" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600" font-size="10" fill="#0b1016" id="hN">N</text></svg></div>
  </div>

  <div class="cred" id="hC">Map data: Natural Earth · © OpenStreetMap contributors · Mapzen terrain tiles</div>
  <aside class="legend" id="legend" aria-label="Map legend"></aside>

  <section class="card" id="card" aria-live="polite">
    <div class="no"><span id="cNo">CHAPTER 1 OF 13</span><span id="cKey"></span></div>
    <div id="cBody"></div>
  </section>

  <nav class="rail" aria-label="Chapters">
    <div class="ctl">
      <button id="bPrev" aria-label="Previous chapter"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button id="bPlay" class="play" aria-label="Pause"><svg viewBox="0 0 16 16"><path id="iPlay" d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
      <button id="bNext" aria-label="Next chapter"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2l8 6-8 6z"/></svg></button>
      <button id="bSound" class="snd invite" aria-label="Turn sound on" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M1.5 6h3l4-3.2v10.4l-4-3.2h-3z"/><path id="iSnd" d="M10.6 5.6l4 4.8M14.6 5.6l-4 4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <div class="lang" role="group" aria-label="Language"><button id="lEn" lang="en" aria-label="English">EN</button><button id="lTr" lang="tr" aria-label="Türkçe">TR</button></div>
    </div>
    <div class="segs" id="segs"></div>
  </nav>

  <div id="load">DRAWING THE MAP…</div>

const G2=[[1,1],[-1,1],[1,-1],[-1,-1],[1.414,0],[-1.414,0],[0,1.414],[0,-1.414]];
const snc=(x,y,i,j)=>{let t=.5-x*x-y*y;if(t<0)return 0;const g=G2[Math.min(7,(hash(i,j)*8)|0)];t*=t;return t*t*(g[0]*x+g[1]*y);};

  for(let i=0;i<GW;i++){const k=j*GW+i,x=X(LON0+i/(GW-1)*(LON1-LON0));

    const sx=-tz*o.w/2,sz=tx*o.w/2,p=pts[i],ax=p.x+sx,az=p.z+sz,bx=p.x-sx,bz=p.z-sz;
    pos.set([ax,Math.max(0,hAt(ax,az))+o.lift,az,bx,Math.max(0,hAt(bx,bz))+o.lift,bz],i*6);
    if(i>0){cum[i]=cum[i-1]+Math.hypot(p.x-pts[i-1].x,p.z-pts[i-1].z);if(!o.dash||Math.floor(cum[i]/o.dash)%2===0){const k=(i-1)*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}idxAt[i]=idx.length;}}

  const mesh=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:o.color,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false,toneMapped:false,fog:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));

    at(p,out){const f=clamp(p)*(N-1),i=Math.min(N-2,f|0),t=f-i;out.set(lerp(pts[i].x,pts[i+1].x,t),0,lerp(pts[i].z,pts[i+1].z,t));out.y=Math.max(0,hAt(out.x,out.z));return out;}};

const MOOD=['dark','hope','resolve','battle','resolve','dark','battle','battle','battle','charge','triumph','resolve','triumph'];
const BPM={dark:68,hope:94,resolve:98,battle:114,charge:134,triumph:106,outro:92};
const PROG={dark:[[50,53,57],[50,53,57],[46,50,53],[45,49,52]],hope:[[53,57,60],[48,52,55],[50,53,57],[46,50,53]],resolve:[[50,53,57],[53,57,60],[48,52,55],[50,53,57]],

const hz=m=>440*Math.pow(2,(m-69)/12);

function ambInit(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();
  const m=actx.createGain();m.gain.value=0;const comp=actx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=5;comp.attack.value=.01;comp.release.value=.2;m.connect(comp);comp.connect(actx.destination);

function env(g,t,peak,a,d){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0004,t+a+d);}
function drum(t,v){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(128,t);o.frequency.exponentialRampToValueAtTime(42,t+.2);env(g,t,v,.004,.34);o.connect(g);g.connect(amb.m);o.start(t);o.stop(t+.45);}
function snare(t,v){const s=actx.createBufferSource();s.buffer=amb.nb;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;f.Q.value=.7;const g=actx.createGain();env(g,t,v,.002,.11);s.connect(f);f.connect(g);g.connect(amb.m);s.start(t,Math.random());s.stop(t+.16);}
function note(t,midi,dur,v,type,cut){const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(cut,t);const g=actx.createGain();env(g,t,v,Math.min(.02,dur*.2),dur);f.connect(g);g.connect(amb.m);

function lead(t,midi,dur,v){const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=2600;const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(v*.5,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0004,t+dur*1.5);f.connect(g);g.connect(amb.m);g.connect(amb.echo);

function pad(t,ch,dur,v,cut,sweep){const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(cut,t);if(sweep)f.frequency.linearRampToValueAtTime(cut*sweep,t+dur*.6);const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+dur*.3);g.gain.setValueAtTime(v,t+dur*.75);g.gain.linearRampToValueAtTime(.0001,t+dur*1.05);f.connect(g);g.connect(amb.m);

function score(){ // schedules a quarter of a second ahead on a sixteenth-note grid
  while(nextStep<actx.currentTime+.25){const t=nextStep,s=step%16;if(s===0){const m2=T>=END-.01?'outro':MOOD[chNow()];if(m2==='outro'&&mood!=='outro'){outroBar=0;step=0;}else if(m2==='outro')outroBar++;mood=m2;}
    const bar=Math.floor(step/16),sp=60/BPM[mood]/4,ch=PROG[mood][bar%PROG[mood].length],hot=mood==='battle'||mood==='charge',bright=mood==='triumph';
    if(s===0){pad(t,ch,sp*16,mood==='dark'?.075:.05,mood==='dark'?520:900,0);if(bright||mood==='charge')pad(t,ch.map(n=>n+12),sp*16,.035,700,2.6);}
    if(mood==='outro'){const full=outroBar>=4,n=TUNE[outroBar%8][s>>1]; // first four bars are a quiet lead-in, then the band joins and the eight bars loop

      if(s%2===0)note(t,ch[(s/2)%3]+12+((s/2)%4===3?12:0),sp*1.7,full?.05:.036,'triangle',1500);
      if(s%8===0)note(t,ch[0]-12,sp*5,.095,'triangle',300);

    else{if(s%4===0)drum(t,hot?.55:bright?.5:.36);if(hot&&(s===10||(mood==='charge'&&s%2===0)))drum(t,.32);

function sound(dt){

  if(adv)T+=dt*D[ci]/wallLen(ci);if(T>=END){T=END;setPlaying(false);}}sound(dt);frame(T,now);}

$('#load').classList.add('off');
window.__lang=setLang;window.__seek=(t,n)=>{T=clamp(t,0,END);setPlaying(false);now=n==null?t:n;frame(T,now);return curCh;};
window.__ready=true;
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
}
