<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A three.js animation on a 3D relief map of Anatolia that follows the Turkish War of Independence, 1918–1923. English and Turkish, with narration.">
<title>Turkish War of Independence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one full-bleed 3D relief map on a table. Masthead top-left, running date top-right,
   narrative card bottom-left, chapter rail along the bottom edge. Single dark look by choice. */
:root{
  --ink:#0b1016; --ink-2:#131b24; --panel:rgba(10,15,21,.84);
  --paper:#efe7d6; --body:#d8d1c0; --muted:#a39f8f; --hair:rgba(239,231,214,.16);
  --red:#e4352b; --red-soft:#ff8f84; --gold:#e9bd62; --blue:#6aa3e6;
  --z-br:#a678c6; --z-fr:#3fb3a7; --z-it:#79b565;
  --f-display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --f-label:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --gut-l:max(22px,env(safe-area-inset-left,0px)); --gut-r:max(22px,env(safe-area-inset-right,0px));
  --rail-h:86px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;background:var(--ink);user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.shade{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(11,16,22,.72) 0,rgba(11,16,22,0) 17%),
    linear-gradient(0deg,rgba(11,16,22,.98) 0,rgba(11,16,22,.86) 9%,rgba(11,16,22,0) 24%),
    radial-gradient(120% 90% at 50% 45%,rgba(11,16,22,0) 55%,rgba(11,16,22,.55) 100%)}

/* labels pinned to the map */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;visibility:hidden;will-change:transform,opacity}
.lb.city{font:500 12px/1 var(--f-label);letter-spacing:.16em;color:var(--paper);
  text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 7px rgba(0,0,0,.9),0 0 2px #000}
.lb.city.major{font-size:14px;font-weight:600;letter-spacing:.2em}
.lb.ev{padding:6px 11px 7px;background:var(--panel);border:1px solid var(--hair);text-align:center}
.lb.ev b{display:block;font:600 14px/1.1 var(--f-label);letter-spacing:.14em;color:var(--paper)}
.lb.ev span{display:block;margin-top:3px;font:italic 400 12.5px/1.15 var(--f-body);color:var(--muted)}
.lb.ev em{display:block;margin-top:4px;font:600 12px/1 var(--f-label);letter-spacing:.2em;font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums}
.lb.ev::before{content:"";position:absolute;left:50%;top:-1px;width:26px;height:2px;margin-left:-13px;background:var(--gold)}
.lb.ev::after{content:"";position:absolute;left:var(--sx,50%);top:100%;width:1px;height:var(--stem,30px);background:linear-gradient(rgba(239,231,214,.85),rgba(239,231,214,.1))}
.lb.ev.battle::before{background:var(--red)} .lb.ev.battle b{color:var(--red-soft)}
.lb.ev.foe::before{background:var(--blue)} .lb.ev.foe b{color:var(--blue)}
.lb.ev.treaty::before{background:var(--paper)}
.lb.zone{text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.85)}
.lb.zone b{display:block;font:600 13px/1 var(--f-label);letter-spacing:.3em;color:#fff}
.lb.zone b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--c,#fff);transform:translateY(-1px) rotate(45deg)}
.lb.zone span{display:block;margin-top:4px;font:italic 400 12px/1 var(--f-body);color:var(--paper)}
.lb.ban{left:50%;top:70px;transform:translateX(-50%);pointer-events:none;text-align:center;padding:18px 90px 22px;background:radial-gradient(closest-side,rgba(11,16,22,.9),rgba(11,16,22,.72) 55%,rgba(11,16,22,0));text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.lb.ban b{display:block;font:600 clamp(20px,3vw,40px)/1 var(--f-display);letter-spacing:.14em;color:var(--paper)}
.lb.ban span{display:block;margin-top:8px;font:600 clamp(11px,1.1vw,15px)/1 var(--f-label);letter-spacing:.42em;color:var(--gold)}

/* masthead + date */
.mast{position:absolute;left:0;top:0;padding:20px var(--gut-r) 0 var(--gut-l);pointer-events:none}
.mast .k{font:600 12px/1 var(--f-label);letter-spacing:.34em;color:var(--red-soft)}
.mast h1{margin:8px 0 0;font:600 clamp(17px,1.9vw,25px)/1.1 var(--f-display);letter-spacing:.02em;color:var(--paper)}
.clock{position:absolute;right:0;top:0;padding:16px var(--gut-r) 34px 90px;text-align:right;pointer-events:none;background:radial-gradient(130% 120% at 100% 0,rgba(11,16,22,.92) 0,rgba(11,16,22,.7) 45%,rgba(11,16,22,0) 72%)}
.clock .t{font:500 11px/1 var(--f-label);letter-spacing:.34em;color:var(--muted)}
.clock .d{margin-top:6px;font:600 clamp(26px,3.4vw,46px)/1 var(--f-label);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--paper)}
.clock .d i{font-style:normal;color:var(--gold)}
.clock .aux{margin-top:10px;display:flex;justify-content:flex-end;align-items:center;gap:12px;font:500 11px/1 var(--f-label);letter-spacing:.24em;color:var(--muted)}
.clock .aux svg{width:38px;height:38px;display:block}
.clock .aux span{animation:hintOut 1.2s ease 16s forwards}
@keyframes hintOut{to{opacity:0}}

/* legend: one row above the rail, changes with the chapter */
.legend{position:absolute;right:var(--gut-r);left:calc(var(--gut-l) + 430px);bottom:calc(var(--rail-h) + 12px);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 20px;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 var(--f-label);letter-spacing:.09em;color:var(--body);text-shadow:0 1px 3px rgba(0,0,0,.9)}
.legend svg{display:block;width:28px;height:12px;flex:none}
.legend .sw{width:22px;height:11px;flex:none;border:1px solid var(--c);background:repeating-linear-gradient(135deg,var(--c) 0 2.5px,rgba(0,0,0,.25) 2.5px 5px)}
.legend .sw.solid{background:var(--c)}

/* legend */

/* narrative card */
.card{position:absolute;left:var(--gut-l);bottom:calc(var(--rail-h) + 16px);width:min(410px,calc(100% - var(--gut-l) - var(--gut-r)));
  box-sizing:border-box;padding:18px 22px 20px;background:var(--panel);border:1px solid var(--hair);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card .no{display:flex;justify-content:space-between;gap:12px;font:500 11.5px/1 var(--f-label);letter-spacing:.3em;color:var(--muted)}
.card .date{margin-top:12px;font:600 15px/1.1 var(--f-label);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.card h2{margin:7px 0 10px;font:600 clamp(23px,2.5vw,33px)/1.08 var(--f-display);text-wrap:balance;color:var(--paper)}
.card p{margin:0;font:400 14.5px/1.5 var(--f-body);color:var(--body)}
.card blockquote{margin:13px 0 0;padding:0 0 0 14px;border-left:1px solid var(--gold);font:italic 400 15px/1.42 var(--f-body);color:var(--paper)}
.card cite{display:block;margin-top:6px;font:500 11px/1.2 var(--f-label);letter-spacing:.2em;font-style:normal;text-transform:uppercase;color:var(--muted)}
.card .in{animation:cardIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* chapter rail */
.rail{position:absolute;left:0;right:0;bottom:0;height:var(--rail-h);box-sizing:border-box;
  padding:0 var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;align-items:flex-end;gap:18px}
.ctl{display:flex;gap:6px;align-items:center;padding-bottom:13px}
.ctl button{width:38px;height:38px;display:grid;place-items:center;padding:0;border:1px solid var(--hair);background:rgba(10,15,21,.7);color:var(--paper);cursor:pointer}
.ctl button.play{width:46px;height:46px;border-color:var(--gold);color:var(--gold)}
.ctl button.snd{margin-left:8px}
.ctl button.snd.invite{border-color:var(--gold);color:var(--gold);animation:invite 2.2s ease-in-out infinite}
.ctl button.snd.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
@keyframes invite{0%,100%{box-shadow:0 0 0 0 rgba(233,189,98,.55)}60%{box-shadow:0 0 0 9px rgba(233,189,98,0)}}
.ctl .lang{display:flex}
.ctl .lang button{width:32px;font:600 12.5px/1 var(--f-label);letter-spacing:.1em}
.ctl .lang button+button{border-left:0}
.ctl .lang button.on{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.ctl button:hover{background:rgba(239,231,214,.12)}
.ctl svg{width:16px;height:16px;fill:currentColor}
.segs{flex:1;min-width:0;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;align-items:end}
.seg{position:relative;display:block;min-width:0;padding:22px 0 0;border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;font:500 12.5px/1 var(--f-label);letter-spacing:.08em}
.seg .yr{position:absolute;left:0;top:2px;font:600 12px/1 var(--f-label);letter-spacing:.2em;color:var(--paper);opacity:.75}
.seg .bar{display:block;height:4px;background:rgba(239,231,214,.2);overflow:hidden}
.seg .bar i{display:block;height:100%;width:0;background:var(--gold)}
.seg .nm{display:block;margin-top:8px;height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg:hover{color:var(--paper)} .seg.on{color:var(--paper)} .seg.on .bar i{background:var(--red)}
.seg.done .bar i{width:100%}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);color:var(--muted);font:500 13px/1.4 var(--f-label);letter-spacing:.34em;text-align:center;transition:opacity .6s}
#load.off{opacity:0;pointer-events:none}

@media (max-width:820px){
  :root{--rail-h:98px;--gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px))}
  .legend{display:none}
  .mast{padding-top:14px} .mast .k{font-size:10px} .mast h1{font-size:14px;max-width:10em}
  .clock .aux{display:none} .lb.ban{top:92px;padding:12px 30px 16px;width:max-content;max-width:92vw}
  .clock{padding-top:12px} .clock .t{font-size:9.5px} .clock .d{font-size:23px}
  .card{bottom:calc(var(--rail-h) + 8px);padding:13px 15px 14px}
  .card .date{margin-top:9px;font-size:13px} .card h2{font-size:21px;margin:5px 0 7px}
  .card p{font-size:13.5px;line-height:1.44} .card blockquote{display:none}
  .rail{flex-direction:column;align-items:stretch;gap:8px} .ctl{padding-bottom:0;justify-content:center} .ctl button{width:36px;height:36px} .ctl button.play{width:42px;height:42px}
  .segs{gap:3px;padding-bottom:6px;flex:none} .seg{padding-top:0} .seg .yr,.seg .nm{display:none} .seg .bar{height:5px}
  .lb.ev b{font-size:12px} .lb.ev span{font-size:11.5px} .lb.city{font-size:10.5px} .lb.city.major{font-size:12px}
}
@media (max-width:1080px){.legend{display:none}}
@media (prefers-reduced-motion:reduce){.card .in{animation:none}.ctl button.snd.invite{animation:none}}
</style>

</head>

      <div class="lang" role="group" aria-label="Language"><button id="lEn" lang="en" aria-label="English">EN</button><button id="lTr" lang="tr" aria-label="Türkçe">TR</button></div>
    </div>
    <div class="segs" id="segs"></div>
  </nav>

  <div id="load">DRAWING THE MAP…</div>

/* ───────────── HUD ───────────── */
const segs=$('#segs'),segEls=CH.map((c,i)=>{const b=document.createElement('button');b.className='seg';
  b.innerHTML=(c.yr?'<span class="yr">'+c.yr+'</span>':'')+'<span class="bar"><i></i></span><span class="nm"></span>';b.addEventListener('click',()=>{seek(C[i]+.01);setPlaying(true);});segs.appendChild(b);return b;});
const MONS={en:['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],tr:['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA']};
let curCh=-1,lastClock='';
const ARW=c=>'<svg viewBox="0 0 28 12"><path d="M0 4.5h18V1l10 5-10 5V7.5H0z" fill="'+c+'"/></svg>',SWT=(c,solid)=>'<i class="sw'+(solid?' solid':'')+'" style="--c:'+c+'"></i>';
const LG={tr:[ARW('#e4352b'),'Turkish national forces'],gr:[ARW('#4f8fdc'),'Greek army'],
 ff:['<svg viewBox="0 0 28 12"><path d="M2 11Q14 -5 26 11" fill="none" stroke="#f3ead6" stroke-width="3.4"/></svg>','Front line falling back'],
 ml:['<svg viewBox="0 0 28 12"><rect x="8" y=".6" width="12" height="10.8" fill="#c9241c" stroke="#fff"/><path d="M8 11.4L20 .6" stroke="#fff"/></svg>','Kuva-yi Milliye militia'],
 ut:['<svg viewBox="0 0 28 12"><rect x="8" y=".6" width="12" height="10.8" fill="#c9241c" stroke="#fff"/><path d="M8 .6l12 10.8M20 .6L8 11.4" stroke="#fff"/></svg>','Turkish units'],
 sr:['<svg viewBox="0 0 28 12"><path d="M0 6h28" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/></svg>','Course of the Bandırma'],
 dp:['<svg viewBox="0 0 28 12"><path d="M0 10Q14 -6 28 10" fill="none" stroke="#f5cd74" stroke-width="1.4"/></svg>','Deputies travelling to Ankara'],
 un:['<svg viewBox="0 0 28 12"><rect x=".6" y=".6" width="12" height="10.8" fill="#c9241c" stroke="#fff"/><path d="M.6.6l12 10.8M12.6.6L.6 11.4" stroke="#fff"/><rect x="15.4" y=".6" width="12" height="10.8" fill="#2f6cc0" stroke="#fff"/><path d="M15.4.6l12 10.8M27.4.6l-12 10.8" stroke="#fff"/></svg>','Army units, Turkish and Greek'],
 fl:['<svg viewBox="0 0 28 12"><path d="M0 9h28" stroke="#ff4a36" stroke-width="3"/><path d="M0 9V2h28v7" fill="rgba(255,74,54,.3)"/></svg>','Turkish defensive line'],
 zg:[SWT('#4f8fdc'),'Greek occupation'],zb:[SWT('#a678c6'),'Allied occupation, British-led'],zf:[SWT('#3fb3a7'),'French occupation'],zi:[SWT('#79b565'),'Italian occupation'],
 rt:['<svg viewBox="0 0 28 12"><path d="M0 6h28" stroke="#f2c25e" stroke-width="2.4" stroke-dasharray="5 3"/></svg>','Mustafa Kemal’s route'],
 bc:['<svg viewBox="0 0 28 12"><circle cx="14" cy="6" r="5.5" fill="rgba(255,200,102,.3)"/><circle cx="14" cy="6" r="2.6" fill="#ffc866"/></svg>','Political milestone'],
 ft:['<svg viewBox="0 0 28 12"><circle cx="14" cy="6" r="4.6" fill="none" stroke="#e4352b" stroke-width="1.6"/></svg>','Fighting'],
 rw:['<svg viewBox="0 0 28 12"><path d="M0 6h28" stroke="#1e1610" stroke-width="4"/><path d="M0 6h28" stroke="#eee4ce" stroke-width="2" stroke-dasharray="4 4"/></svg>','Railway'],
 sg:[SWT('#467dc8',1),'Greece'],ss:[SWT('#9669b9',1),'Straits zone'],si:[SWT('#64a055',1),'Italian sphere'],sf:[SWT('#37a096',1),'French sphere'],sa:[SWT('#d78c3c',1),'Armenia'],sk:[SWT('#cdb84a',1),'Kurdistan'],
 bd:['<svg viewBox="0 0 28 12"><path d="M0 6h28" stroke="#ffc85e" stroke-width="3.4"/></svg>','Borders recognised at Lausanne']};
const LGC=[['zb','zf','zi','zg','rw'],['sr'],['rt','bc','rw'],['zf','ft','ml','bc'],['dp','bc','rw'],[[0,['gr','zg','zb']],[4.4,['sg','ss','si','sf','sa','sk']]],['tr','ut','ft'],['tr','gr','un','fl','zg','rw'],['tr','gr','un','fl','zg','rw'],[[0,['tr','un','zg','rw']],[5.5,['tr','un','zg','ff','rw']]],[[0,['tr','rw']],[8,['zg','zb','rw']]],['bd'],['bd']];
let lgKey='';function legend(i,s){let k=LGC[i];if(Array.isArray(k[0])){let q=k[0][1];for(const e of k)if(s>=e[0])q=e[1];k=q;}const id=LANG+k.join();if(id===lgKey)return;lgKey=id;$('#legend').innerHTML=k.map(x=>'<span>'+LG[x][0]+tt(LG[x][1])+'</span>').join('');}
function hud(T){let i=0;while(i<NC-1&&T>=C[i+1])i++;const c=CH[i][LANG],u=clamp((T-C[i])/D[i]);
  if(i!==curCh){curCh=i;$('#cNo').textContent=LANG==='tr'?'BÖLÜM '+(i+1)+' / '+NC:'CHAPTER '+(i+1)+' OF '+NC;$('#cKey').textContent=(LANG==='tr'?c.key.toLocaleUpperCase('tr'):c.key.toUpperCase().replace('İZMIR','İZMİR'))+' · '+CH[i].d1;
    hudBoxes.due=2;$('#cBody').innerHTML='<div class="in"><div class="date">'+c.date+'</div><h2>'+c.title+'</h2><p>'+c.body+'</p>'+(c.quote?'<blockquote>“'+c.quote+'”<cite>'+c.src+'</cite></blockquote>':'')+'</div>';
    segEls.forEach((s,k)=>{s.classList.toggle('on',k===i);s.classList.toggle('done',k<i);if(k>i)s.querySelector('i').style.width='0';if(k<i)s.querySelector('i').style.width='';});}
  legend(i,T-C[i]);segEls[i].querySelector('i').style.width=(u*100).toFixed(1)+'%';
  const d=new Date(dateAt(i,T-C[i])),s=d.getUTCDate()+' '+MONS[LANG][d.getUTCMonth()]+' <i>'+d.getUTCFullYear()+'</i>';if(s!==lastClock){lastClock=s;$('#clock').innerHTML=s;}}

const v3=new THREE.Vector3();let SW=1,SHt=1,railPad=120;
const hudRects=[];
function hide(o){if(o.shown){o.el.style.visibility='hidden';o.shown=false;}}
const hits=(x,y,w,h,r)=>x<r[2]&&x+w>r[0]&&y<r[3]&&y+h>r[1];
function placeLabels(T){const taken=hudRects.slice();
  for(let pass=0;pass<2;pass++)for(const o of labels){const callout=!!o.stem||o.hud||o.cls==='zone';if(callout!==(pass===0))continue;
    const a=vis(o.spans,T);if(a<=.01){hide(o);continue;}
    if(o.hud){o.el.style.opacity=a.toFixed(3);if(!o.shown){o.el.style.visibility='visible';o.shown=true;}continue;}
    v3.copy(o.p).project(camera);if(v3.z>1||Math.abs(v3.x)>1.25||Math.abs(v3.y)>1.25){hide(o);continue;}
    let x=(v3.x*.5+.5)*SW,y=(-v3.y*.5+.5)*SHt;
    if(o.stem){const px=x,dx=o.dxf?o.dxf():(o.dx||0);x=clamp(x-o.w/2+(narrowUI?0:dx),8,Math.max(8,SW-o.w-8));y-=o.h+o.stem+(1-a)*8;const sx=clamp(px-x,6,o.w-6);if(Math.abs(sx-(o.sx||-1))>.5){o.sx=sx;o.el.style.setProperty('--sx',sx.toFixed(1)+'px');}}
    else if(o.side==='r'){x+=9;y-=o.h/2;}else if(o.side==='l'){x-=o.w+9;y-=o.h/2;}else if(o.side==='t'){x-=o.w/2;y-=o.h+8;}else if(o.side==='b'){x-=o.w/2;y+=8;}else{x-=o.w/2;y-=o.h/2;}
    const fb=clamp((SHt-railPad-(y+o.h))/26);if(fb<=.01){hide(o);continue;}
    if(pass===0){if(a>.5)taken.push([x-4,y-4,x+o.w+4,y+o.h+4]);}
    else{if(x<4||x+o.w>SW-4||y<4){hide(o);continue;}let hit=false;for(const r of taken)if(hits(x,y,o.w,o.h,r)){hit=true;break;}if(hit){hide(o);continue;}}
    o.el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';o.el.style.opacity=(a*fb).toFixed(3);if(!o.shown){o.el.style.visibility='visible';o.shown=true;}}}
function hudBoxes(){hudRects.length=0;const s0=stage.getBoundingClientRect();for(const q of ['.mast','.clock','#card']){const e=$(q);if(!e)continue;const r=e.getBoundingClientRect();let b=[r.left-s0.left,r.top-s0.top,r.right-s0.left,r.bottom-s0.top];if(q==='.clock')b=[b[2]-330,b[1],b[2],b[1]+128];if(q==='.mast')b=[b[0],b[1],b[0]+Math.min(470,r.width),b[1]+84];hudRects.push(b);}}
function measure(){for(const o of labels){o.w=o.el.offsetWidth;o.h=o.el.offsetHeight;}hudBoxes();}
function resize(){SW=stage.clientWidth;SHt=stage.clientHeight;renderer.setSize(SW,SHt,false);camera.aspect=SW/SHt;
  const narrow=SW<820;narrowUI=narrow;lastOx=-1;railPad=narrow?104:122;camera.setViewOffset(SW,SHt,narrow?0:-SW*.06,narrow?SHt*.17:SHt*.035,SW,SHt);camera.updateProjectionMatrix();measure();}
window.addEventListener('resize',resize);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);

/* ───────────── playback ───────────── */
let T=0,playing=!window.matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now(),now=0;
const PLAY='M3 2l11 6-11 6z',PAUSE='M3 2h4v12H3zM9 2h4v12H9z',REPLAY='M8 2a6 6 0 1 0 6 6h-2a4 4 0 1 1-4-4v3l5-4-5-4z';
function setPlaying(p){playing=p;$('#iPlay').setAttribute('d',p?PAUSE:(T>=END-.01?REPLAY:PLAY));$('#bPlay').setAttribute('aria-label',tt(p?'Pause':(T>=END-.01?'Replay':'Play')));}
function seek(t){T=clamp(t,0,END);narSeek=true;}
const chNow=()=>{let i=0;while(i<NC-1&&T>=C[i+1])i++;return i;};
$('#bPlay').addEventListener('click',()=>{if(!playing&&T>=END-.01)T=0;setPlaying(!playing);});
$('#bPrev').addEventListener('click',()=>{const i=chNow();seek(C[T-C[i]>2?i:Math.max(0,i-1)]+.01);});
$('#bNext').addEventListener('click',()=>{seek(C[Math.min(NC-1,chNow()+1)]+.01);});
window.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&e.code==='Space')return;if(e.code==='Space'){e.preventDefault();$('#bPlay').click();}else if(e.code==='ArrowRight')$('#bNext').click();else if(e.code==='ArrowLeft')$('#bPrev').click();});
let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az:user.az,el:user.el};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;user.az=clamp(drag.az-(e.clientX-drag.x)*.22,-80,80);user.el=clamp(drag.el+(e.clientY-drag.y)*.16,-30,30);});
['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>{drag=null;}));
canvas.addEventListener('wheel',e=>{e.preventDefault();user.zoom=clamp(user.zoom*Math.exp(e.deltaY*.0012),.45,1.7);},{passive:false});
canvas.addEventListener('dblclick',()=>{user.az=user.el=0;user.zoom=1;});

function frame(T,now){if(hudBoxes.due&&!--hudBoxes.due)hudBoxes();tracks(T,now);for(const f of anim)f(T,now);camAt(T);camera.updateMatrixWorld();hud(T);placeLabels(T);renderer.render(scene,camera);}
/* language */
function applyLang(first){document.documentElement.lang=LANG;document.title=tt('Turkish War of Independence');
  $('#hK').textContent=tt('KURTULUŞ SAVAŞI · 1919 – 1923');$('#hT').textContent=tt('The Turkish War of Independence');$('#hD').textContent=tt('DATE ON THE MAP');$('#hH').textContent=tt('DRAG TO ORBIT · SCROLL TO ZOOM');$('#hN').textContent=tt('N');
  $('#bPrev').setAttribute('aria-label',tt('Previous chapter'));$('#bNext').setAttribute('aria-label',tt('Next chapter'));$('#bSound').setAttribute('aria-label',tt(soundOn?'Turn sound off':'Turn sound on'));
  $('#legend').setAttribute('aria-label',tt('Map legend'));$('.rail').setAttribute('aria-label',tt('Chapters'));$('.ctl .lang').setAttribute('aria-label',tt('Language'));
  $('#lEn').classList.toggle('on',LANG==='en');$('#lTr').classList.toggle('on',LANG==='tr');$('#lEn').setAttribute('aria-pressed',LANG==='en');$('#lTr').setAttribute('aria-pressed',LANG==='tr');
  segEls.forEach((b,i)=>{const c=CH[i][LANG];b.querySelector('.nm').textContent=c.key;b.setAttribute('aria-label',tt('Chapter')+' '+(i+1)+': '+c.title);});
  for(const o of labels)if(o.t!=null)o.el.innerHTML=mk(o);dayTxt='';curCh=-1;lgKey='';lastClock='';setPlaying(playing);
  if(!first){tex.userData.letter();narKey='';measure();frame(T,now);}}
function setLang(l){if(l===LANG)return;LANG=l;try{localStorage.setItem('twi-lang',l);}catch(e){}applyLang(false);}
$('#lEn').addEventListener('click',()=>setLang('en'));$('#lTr').addEventListener('click',()=>setLang('tr'));

/* sound: narration files plus a quiet synthesised bed (drone, wind, distant guns) */
let soundOn=false,actx=null,amb=null,narKey='',narReady=false,narSeek=true,nextThump=0,hornDone=false,chordDone=false;
const nar=new Audio();nar.preload='auto';const narUrl={};
const wallLen=i=>soundOn?Math.max(D[i],ADUR[LANG][i]+2):D[i];
const narName=i=>LANG+'-'+String(i).padStart(2,'0');
function narLoad(k){if(narUrl[k])return Promise.resolve(narUrl[k]);return fetch('audio/'+k+'.mp3').then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>narUrl[k]=URL.createObjectURL(b)).catch(()=>narUrl[k]='audio/'+k+'.mp3');}
function ambInit(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();const m=actx.createGain();m.gain.value=0;m.connect(actx.destination);
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.connect(m);const dg=actx.createGain();dg.gain.value=.05;dg.connect(lp);
  [[73.42,'sawtooth',.45],[110,'triangle',.5],[146.83,'sine',.32],[220.4,'sine',.1]].forEach(q=>{const o=actx.createOscillator(),g=actx.createGain();o.type=q[1];o.frequency.value=q[0];o.detune.value=(Math.random()-.5)*12;g.gain.value=q[2];o.connect(g);g.connect(dg);o.start();});
  const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.06;lg.gain.value=.018;lfo.connect(lg);lg.connect(dg.gain);lfo.start();
  const nb=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate),ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  const ns=actx.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=480;bp.Q.value=.5;const wg=actx.createGain();wg.gain.value=.011;ns.connect(bp);bp.connect(wg);wg.connect(m);ns.start();
  const wl=actx.createOscillator(),wlg=actx.createGain();wl.frequency.value=.09;wlg.gain.value=200;wl.connect(wlg);wlg.connect(bp.frequency);wl.start();
  amb={m,nb};}
function thump(v){const t=actx.currentTime,src=actx.createBufferSource();src.buffer=amb.nb;src.playbackRate.value=.45+Math.random()*.3;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=80+Math.random()*90;
  const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0006,t+.8+Math.random()*.9);src.connect(f);f.connect(g);g.connect(amb.m);src.start(t,Math.random());src.stop(t+2.2);}
function tone(freqs,type,peak,attack,hold,release,cut){const t=actx.currentTime,f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+attack);g.gain.setValueAtTime(peak,t+attack+hold);g.gain.exponentialRampToValueAtTime(.0005,t+attack+hold+release);f.connect(g);g.connect(amb.m);
  freqs.forEach(q=>{const o=actx.createOscillator();o.type=type;o.frequency.value=q;o.connect(f);o.start(t);o.stop(t+attack+hold+release+.1);});}
function sound(dt){
  if(amb)amb.m.gain.setTargetAtTime(soundOn&&playing?1:0,actx.currentTime,.35);
  if(!soundOn||!playing||T>=END){if(!nar.paused)nar.pause();return;}
  const i=chNow(),k=narName(i),pos=(T-C[i])/D[i]*wallLen(i)-.7;
  if(amb){let b=false;for(const w of BATTLE)if(T>w[0]&&T<w[1]){b=true;break;}
    if(b&&actx.currentTime>nextThump){thump(.22+Math.random()*.3);nextThump=actx.currentTime+.3+Math.random()*1.2;}
    if(T<at(1,.8))hornDone=false;else if(!hornDone&&T<at(1,2.5)){hornDone=true;tone([98,147.2],'sawtooth',.07,.12,1.3,.7,520);}
    if(T<at(12,1.2))chordDone=false;else if(!chordDone&&T<at(12,4)){chordDone=true;tone([146.83,185,220,293.66,440],'triangle',.045,2.2,3.5,6,1400);}}
  if(k!==narKey){narKey=k;narReady=false;nar.pause();narLoad(k).then(u=>{if(narKey!==k)return;nar.src=u;narReady=true;narSeek=true;});if(i<NC-1)narLoad(narName(i+1));return;}
  if(!narReady)return;
  if(pos<0||pos>=ADUR[LANG][i]-.05){if(!nar.paused)nar.pause();narSeek=true;return;}
  if(narSeek||Math.abs(nar.currentTime-pos)>.8){try{nar.currentTime=pos;}catch(e){}narSeek=false;}
  if(nar.paused&&!nar.ended)nar.play().catch(()=>{});}
function setSound(on){soundOn=on;const b=$('#bSound');b.classList.remove('invite');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',tt(on?'Turn sound off':'Turn sound on'));
  $('#iSnd').setAttribute('d',on?'M10.8 5.4q1.9 2.6 0 5.2M12.9 3.6q3.3 4.4 0 8.8':'M10.6 5.6l4 4.8M14.6 5.6l-4 4.8');
  if(on){if(!actx)ambInit();if(actx&&actx.state==='suspended')actx.resume();narKey='';narSeek=true;if(T>=END-.01)T=0;else seek(C[chNow()]+.01);if(!playing)setPlaying(true);}else nar.pause();}
$('#bSound').addEventListener('click',()=>setSound(!soundOn));

function loop(t){requestAnimationFrame(loop);if(window.__manual)return;const dt=Math.min(.1,(t-last)/1000);last=t;now+=dt;if(playing){const ci=chNow();let adv=true;
  // while narration is playing it is the clock, so slow frames cannot pull the voice and the picture apart
  if(soundOn&&narReady&&!narSeek&&narKey===narName(ci)&&!nar.paused){const Tn=C[ci]+(nar.currentTime+.7)/wallLen(ci)*D[ci];T=clamp(Tn,C[ci],C[ci+1]-.001);adv=false;}
  if(adv)T+=dt*D[ci]/wallLen(ci);if(T>=END){T=END;setPlaying(false);}}sound(dt);frame(T,now);}
resize();applyLang(true);measure();frame(0,0);
$('#load').classList.add('off');
window.__lang=setLang;window.__seek=(t,n)=>{T=clamp(t,0,END);setPlaying(false);now=n==null?t:n;frame(T,now);return curCh;};
window.__ready=true;
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
}
