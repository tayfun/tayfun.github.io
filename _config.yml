# Jekyll configuration for blog.tayfunsen.com
# See: https://jekyllrb.com/docs/configuration/

title: "ramblings of an embodied carbon based lifeform (not a silicon parrot?)"
# Short wordmark used in the header so the long title doesn't break the
# layout. Falls back to `title` if unset.
brand: "ramblings"
tagline: "Tayfun Şen's personal blog — software, travel, books, observations."
description: "Tayfun Şen's personal blog — software, travel, books, observations."
author: "Tayfun Şen"
url: "https://blog.tayfunsen.com"
baseurl: ""
lang: "en"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:title.html
paginate: 5
paginate_path: "/page:num/"
future: false
show_drafts: false

# Use the time in the front matter (not the file system time) for dates
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false

# Plugins (whitelisted on GitHub Pages: https://pages.github.com/versions/)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - vendor
  - node_modules
  - .git
  - .gitignore

# Feed
feed:
  path: feeds/posts/default.atom