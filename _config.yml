# Jekyll configuration for tayfunsen.com
# See: https://jekyllrb.com/docs/configuration/

title: "ramblings of an embodied consciousness"
tagline: "not a stochastic silicon parrot"
description: "Tayfun Şen's personal blog — software, travel, books, observations."
author: "Tayfun Şen"
url: "https://tayfunsen.com"
baseurl: ""
lang: "en"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:title.html
paginate: 5
paginate_path: "/page:num/"
future: false
show_drafts: false

# Use the time in the front matter (not the file system time) for dates
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
  - scope:
      path: ""
    values:
      # Default Open Graph / Twitter card image (used by jekyll-seo-tag)
      image: /assets/images/og-image.png

# Plugins (whitelisted on GitHub Pages: https://pages.github.com/versions/)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - vendor
  - node_modules
  - .git
  - .gitignore

# Feed
feed:
  path: feeds/posts/default.atom